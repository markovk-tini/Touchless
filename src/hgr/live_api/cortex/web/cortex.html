<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Iris Cortex</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Three.js + post-processing loaded as ESM from the vendored
       copies under ./vendor/. Mirrors the jsdelivr layout so the
       addons' relative imports resolve naturally. Pinned at r160. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <!-- Qt-injected web channel JS shim. Always available in QtWebEngine. -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <canvas id="cortex"></canvas>
  <div id="hover-label"></div>
  <div id="breadcrumb">
    <span class="bc-crumb" data-bc-home>IRIS</span><span class="bc-sep"> › </span><span class="bc-crumb" id="bc-current"></span>
  </div>
  <div id="debug">
    FPS: <span id="fps">--</span><br>
    Nodes: <span id="nodecount">0</span><br>
    Events/s: <span id="evrate">0</span>
  </div>
  <div id="hint">Click a sphere to expand · Esc to return · drag = orbit · scroll = zoom</div>
  <script type="module" src="cortex.js"></script>
</body>
</html>
