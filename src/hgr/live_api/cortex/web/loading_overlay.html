<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iris Loading</title>
<style>
  /* Reset + dark cortex backdrop matching iris_simulator.html. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050a14;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 sans-serif;
  }

  /* Center the iris + caption stack with flexbox so it stays put
     even as the surrounding panel resizes during splitter drags. */
  .wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: rgba(180, 140, 255, 0.85);
  }

  /* Spinning iris glyph — uses transform: rotate via @keyframes so
     it's GPU-accelerated and stays smooth even when the QWebEngine
     surface is small. Pulse + soft glow done with text-shadow. */
  .iris {
    font-size: 56px;
    line-height: 1;
    color: rgba(190, 160, 255, 0.95);
    text-shadow:
      0 0 12px rgba(140, 110, 220, 0.55),
      0 0 28px rgba(80, 200, 220, 0.30);
    animation: spin 5s linear infinite,
               pulse 2.4s ease-in-out infinite;
    transform-origin: 50% 50%;
    user-select: none;
  }

  @keyframes spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1.0; }
  }

  /* Caption row: 'Loading' + 3 staggered dots that fade-in/out. */
  .cap {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-weight: 300;
    color: rgba(180, 140, 255, 0.75);
  }

  .cap .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(140, 200, 220, 0.85);
    display: inline-block;
    opacity: 0.2;
    animation: dot 1.2s ease-in-out infinite;
  }
  .cap .dot:nth-child(2) { animation-delay: 0.0s; }
  .cap .dot:nth-child(3) { animation-delay: 0.4s; }
  .cap .dot:nth-child(4) { animation-delay: 0.8s; }

  @keyframes dot {
    0%, 100% { opacity: 0.2; transform: translateY(0); }
    50%      { opacity: 1.0; transform: translateY(-2px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="iris">&#10022;</div>
    <div class="cap">
      <span>Loading</span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
