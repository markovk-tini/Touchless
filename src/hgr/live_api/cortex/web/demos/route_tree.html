<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Iris Cortex — Route Decision demo</title>
  <style>
    html, body { margin: 0; padding: 0; background: #050a14; color: #C8E6FF; overflow: hidden; height: 100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    #canvas { position: absolute; inset: 0; }
    #panel { position: absolute; top: 18px; left: 18px; background: rgba(6,16,30,0.78); border: 1px solid rgba(245,181,66,0.30); border-radius: 10px; padding: 14px 18px; font-size: 13px; min-width: 320px; z-index: 10; }
    #panel h1 { font-size: 12px; letter-spacing: 3px; color: #F5B542; margin: 0 0 10px 0; font-weight: 800; text-transform: uppercase; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .label { color: rgba(200,230,255,0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    button { background: rgba(245,181,66,0.10); border: 1px solid rgba(245,181,66,0.40); color: #C8E6FF; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 4px; }
    button.active { background: rgba(245,181,66,0.28); border-color: #F5B542; color: #fff; }
    button:hover { background: rgba(245,181,66,0.18); }
    #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: rgba(200,230,255,0.5); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; pointer-events: none; }
    .back { position: absolute; top: 18px; right: 18px; color: rgba(200,230,255,0.6); text-decoration: none; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; z-index: 10; }
    .back:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <a class="back" href="./index.html">← all demos</a>
  <div id="panel">
    <h1>#3 — Route decision tree</h1>
    <div class="row"><span class="label">Fire a turn</span>
      <div>
        <button data-layer="router">Router</button>
        <button data-layer="planner">Planner</button>
        <button data-layer="connector">Connector</button>
        <button data-layer="realtime">Realtime</button>
      </div>
    </div>
    <div class="row"><span class="label">Auto</span>
      <button id="auto">Auto OFF</button>
    </div>
    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 10px; color: rgba(200,230,255,0.55); line-height: 1.5;">
      Each turn fans 4 dim candidate strokes from the input glyph; the chosen layer ignites with a bright tube ribbon over 600ms. Westworld speech-tree aesthetic — pruning made visible.
    </div>
  </div>
  <div id="hint">Click a layer button to simulate routing · drag to orbit</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x050a14, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(0, 6, 36);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true; controls.dampingFactor = 0.08;

    scene.add(new THREE.AmbientLight(0x101830, 0.25));
    const sun = new THREE.PointLight(0xb6dcff, 1.8, 200, 1.3);
    sun.position.set(0, 0, 0);
    scene.add(sun);

    // Iris core (smaller, just an anchor)
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2, 3),
      new THREE.MeshStandardMaterial({
        color: 0xc8dded, emissive: 0x2faecf,
        emissiveIntensity: 0.7, roughness: 0.42, metalness: 0.4,
      })
    );
    scene.add(core);

    // 4 routing layer nodes in a row above the core
    const LAYERS = [
      { id: 'router',    label: 'Router',    color: 0x58e3ff, x: -12 },
      { id: 'planner',   label: 'Planner',   color: 0xf5b542, x:  -4 },
      { id: 'connector', label: 'Connector', color: 0xb388ff, x:   4 },
      { id: 'realtime',  label: 'Realtime',  color: 0xef7fc7, x:  12 },
    ];

    const haloTex = (() => {
      const c = document.createElement('canvas'); c.width = 128; c.height = 128;
      const g = c.getContext('2d').createRadialGradient(64,64,0,64,64,64);
      g.addColorStop(0, 'rgba(255,255,255,0.85)');
      g.addColorStop(0.2, 'rgba(255,255,255,0.42)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.10)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
      const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
    })();

    function makeLabel(text) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.font = 'bold 44px -apple-system, Segoe UI, Roboto, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(5,10,20,0.95)';
      ctx.strokeText(text, 256, 64);
      ctx.fillStyle = 'rgba(180, 200, 220, 1.0)';
      ctx.fillText(text, 256, 64);
      const t = new THREE.CanvasTexture(c); t.needsUpdate = true;
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
      s.scale.set(8, 2, 1);
      return s;
    }

    const layerNodes = {};
    for (const L of LAYERS) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 20, 16),
        new THREE.MeshStandardMaterial({
          color: 0xdfeeff, emissive: L.color,
          emissiveIntensity: 0.5, roughness: 0.5, metalness: 0.35,
        })
      );
      mesh.position.set(L.x, 8, 0);
      scene.add(mesh);

      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: haloTex, color: L.color, transparent: true, opacity: 0.45,
        depthWrite: false, blending: THREE.AdditiveBlending,
      }));
      halo.scale.set(5, 5, 1);
      halo.position.copy(mesh.position);
      scene.add(halo);

      const label = makeLabel(L.label);
      label.position.copy(mesh.position);
      label.position.y += 2.4;
      scene.add(label);

      layerNodes[L.id] = { mesh, halo, label, color: L.color, baseEmissive: 0.5 };
    }

    // Input glyph at bottom center
    const mic = new THREE.Mesh(
      new THREE.ConeGeometry(0.9, 1.6, 6),
      new THREE.MeshStandardMaterial({
        color: 0xdfeeff, emissive: 0x4a8db0,
        emissiveIntensity: 0.6, roughness: 0.5, metalness: 0.5,
      })
    );
    mic.position.set(0, -8, 0);
    mic.rotation.x = Math.PI;
    scene.add(mic);
    const micLabel = makeLabel('input');
    micLabel.scale.set(5, 1.3, 1);
    micLabel.position.copy(mic.position);
    micLabel.position.y -= 2.0;
    scene.add(micLabel);

    // Animated strokes — pool both dim candidates and the bright chosen one.
    const STROKES_LIFE = 1800;
    const strokes = [];

    function fireRouteDecision(chosenId) {
      const now = performance.now();
      const start = mic.position.clone();
      for (const L of LAYERS) {
        const end = layerNodes[L.id].mesh.position.clone();
        const mid = start.clone().add(end).multiplyScalar(0.5);
        mid.z += (Math.random() - 0.5) * 4;
        const curve = new THREE.CatmullRomCurve3([start, mid, end]);
        const isChosen = (L.id === chosenId);
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 40, isChosen ? 0.20 : 0.06, 8, false),
          new THREE.MeshBasicMaterial({
            color: isChosen ? L.color : 0x5a7390,
            transparent: true, opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          })
        );
        scene.add(tube);
        strokes.push({ tube, born: now, isChosen, layerId: L.id });
      }
    }

    function updateStrokes(now, dt) {
      for (let i = strokes.length - 1; i >= 0; i--) {
        const s = strokes[i];
        const t = (now - s.born) / STROKES_LIFE;
        if (t >= 1) { scene.remove(s.tube); s.tube.geometry.dispose(); s.tube.material.dispose(); strokes.splice(i, 1); continue; }
        // Dim sibling: faint constant opacity; fades at the end.
        if (!s.isChosen) {
          let alpha;
          if (t < 0.1) alpha = (t / 0.1) * 0.18;
          else if (t < 0.7) alpha = 0.18;
          else alpha = 0.18 * (1 - (t - 0.7) / 0.3);
          s.tube.material.opacity = alpha;
          continue;
        }
        // Chosen path: igniting over the first 600ms then sustained, then fade
        let alpha;
        if (t < 0.33) alpha = (t / 0.33) * 1.0;
        else if (t < 0.75) alpha = 1.0;
        else alpha = 1.0 * (1 - (t - 0.75) / 0.25);
        s.tube.material.opacity = alpha;
        // Brighten the chosen layer node during ignition
        const n = layerNodes[s.layerId];
        if (n && t < 0.5) {
          n.mesh.material.emissiveIntensity = n.baseEmissive + (1 - t / 0.5) * 1.5;
        }
      }
    }

    // Post
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(renderer.getPixelRatio());
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.10, 0.4, 0.55);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // Buttons
    document.querySelectorAll('[data-layer]').forEach(btn => {
      btn.addEventListener('click', () => fireRouteDecision(btn.dataset.layer));
    });
    let auto = false, lastAuto = 0;
    document.getElementById('auto').addEventListener('click', () => {
      auto = !auto;
      const b = document.getElementById('auto');
      b.textContent = auto ? 'Auto ON' : 'Auto OFF';
      b.classList.toggle('active', auto);
    });

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (auto && now - lastAuto > 2400 + Math.random() * 1500) {
        fireRouteDecision(LAYERS[Math.floor(Math.random()*4)].id);
        lastAuto = now;
      }
      for (const id in layerNodes) {
        const n = layerNodes[id];
        n.mesh.material.emissiveIntensity += (n.baseEmissive - n.mesh.material.emissiveIntensity) * Math.min(1, dt * 3);
        n.mesh.rotation.y += dt * 0.18;
        n.halo.position.copy(n.mesh.position);
        n.label.position.copy(n.mesh.position).add(new THREE.Vector3(0, 2.4, 0));
      }
      mic.rotation.y += dt * 0.4;
      core.rotation.y += dt * 0.12;
      updateStrokes(now, dt);
      controls.update();
      composer.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight, false);
      composer.setSize(innerWidth, innerHeight);
      bloom.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
