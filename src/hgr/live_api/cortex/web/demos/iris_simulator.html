    // ── Memory data injection. Hangs the live MemoryStore content as
    // tier-3 leaves under existing 'mem-facts' (already hardcoded) and
    // brand-new 'mem-episodes' + 'mem-active' tier-2 sub-nodes (which
    // we also create here, parented to cap-memory). Uses the same
    // purple memory tint as the rest of cap-memory's subtree.
    function worldToMemoryNodeDefs(world) {
      const out = [];
      const mem = world && world.memory ? world.memory : null;
      if (!mem) return out;
      const MEM_BASE = 0xb388ff;
      const MEM_HOT  = 0xede0ff;
      // mem-facts already exists in HARDCODED_NODE_DEFS as a tier-2
      // sub-node of cap-memory — just hang leaves under it.
      // If facts span multiple source_kinds, annotate each leaf label
      // with a small provenance glyph so the user can see at-a-glance
      // where the fact came from. If all facts share one source (or
      // none have source_kind), labels render flat as before.
      const FACT_SRC_GLYPHS = {
        conversation: '💬 ',
        project_file: '📄 ',
        email:        '✉️ ',
        calendar:     '📅 ',
        tool_pattern: '🔧 ',
        git_config:   '⚙️ ',
      };
      const facts = Array.isArray(mem.facts) ? mem.facts : [];
      const factSrcSet = new Set();
      for (const f of facts) {
        if (f && typeof f.source_kind === 'string' && f.source_kind) {
          factSrcSet.add(f.source_kind);
        }
      }
      const annotateFactSrc = factSrcSet.size > 1;
      for (const f of facts) {
        const baseLabel = f.label || '';
        let lbl = baseLabel;
        if (annotateFactSrc && f && typeof f.source_kind === 'string') {
          const g = FACT_SRC_GLYPHS[f.source_kind];
          if (g) lbl = `${g}${baseLabel}`;
        }
        out.push({
          id: f.id, parent: 'mem-facts', pos: [0, 0, 0], r: 0.30,
          base: MEM_BASE, hot: MEM_HOT, halo: 0,
          label: lbl.slice(0, 56), tier: 3,
          text: f.text || null,
        });
      }
      // mem-episodes: new tier-2 branch under cap-memory.
      const eps = Array.isArray(mem.episodes) ? mem.episodes : [];
      if (eps.length > 0) {
        out.push({
          id: 'mem-episodes', parent: 'cap-memory', pos: [-22, 1, 4], r: 0.55,
          base: MEM_BASE, hot: MEM_HOT, halo: MEM_BASE,
          label: 'Episodes', tier: 2,
        });
        for (const e of eps) {
          out.push({
            id: e.id, parent: 'mem-episodes', pos: [0, 0, 0], r: 0.30,
            base: MEM_BASE, hot: MEM_HOT, halo: 0,
            label: e.label || '', tier: 3,
            text: e.text || null,
          });
        }
      }
      // mem-active: new tier-2 branch under cap-memory.
      const active = Array.isArray(mem.active_context) ? mem.active_context : [];
      if (active.length > 0) {
        out.push({
          id: 'mem-active', parent: 'cap-memory', pos: [-22, -2, 0], r: 0.55,
          base: MEM_BASE, hot: MEM_HOT, halo: MEM_BASE,
          label: 'Active Context', tier: 2,
        });
        for (const a of active) {
          out.push({
            id: a.id, parent: 'mem-active', pos: [0, 0, 0], r: 0.30,
            base: MEM_BASE, hot: MEM_HOT, halo: 0,
            label: a.label || '', tier: 3,
            text: a.text || null,
          });
        }
      }
      // mem-patterns: new tier-2 branch surfacing repeated query habits
      // + recurring tool-pair sequences. Cap-memory's purple tint.
      // Capped at 30 leaves by the launcher (gather_patterns()) so
      // this branch can't blow out the constellation. Hidden entirely
      // when no patterns were detected (cold start or empty memory).
      const patterns = Array.isArray(mem.patterns) ? mem.patterns : [];
      if (patterns.length > 0) {
        out.push({
          id: 'mem-patterns', parent: 'cap-memory', pos: [-22, -5, 4], r: 0.55,
          base: MEM_BASE, hot: MEM_HOT, halo: MEM_BASE,
          label: 'Patterns', tier: 2,
        });
        // Cap defensively in case the launcher returned more than 30.
        for (const p of patterns.slice(0, 30)) {
          if (!p || !p.id) continue;
          const count = Number(p.count || 0);
          const kindTag = p.kind === 'tool_seq' ? '⇄ ' : '↻ ';
          const lbl = `${kindTag}${p.label || ''} ×${count}`;
          out.push({
            id: p.id, parent: 'mem-patterns', pos: [0, 0, 0], r: 0.30,
            base: MEM_BASE, hot: MEM_HOT, halo: 0,
            label: lbl.slice(0, 56), tier: 3,
            text: `${p.kind || 'pattern'} · seen ${count}×`,
          });
        }
      }
      // mem-contacts: tier-2 node already exists in HARDCODED_NODE_DEFS
      // as an empty placeholder under cap-memory. Here we populate it
      // with tier-3 leaves — one per learned contact — drawn from
      // memory.contacts (provided by the cortex launcher).
      //
      // Each contact may carry `sources: [{kind, source_id}, ...]` and
      // a `confidence` score (0..1). Glyph prefix is picked from the
      // FIRST source kind for label brevity; the hover tooltip lists
      // every source. Capped at 60 leaves so the bubble can't explode.
      const CONTACT_SRC_GLYPHS = {
        factual:      '📇 ',
        email:        '✉️ ',
        calendar:     '📅 ',
        mention:      '💬 ',
        git:          '⚡ ',
        conversation: '💬 ',
        project:      '📁 ',
      };
      const contacts = Array.isArray(mem.contacts) ? mem.contacts : [];
      if (contacts.length > 0) {
        // Sort by confidence desc (stable for equal scores); items
        // without a numeric confidence get treated as 0.
        const sorted = contacts.slice().sort((a, b) => {
          const ca = Number((a && a.confidence) || 0);
          const cb = Number((b && b.confidence) || 0);
          return cb - ca;
        });
        for (const c of sorted.slice(0, 60)) {
          if (!c || !c.id) continue;
          const sources = Array.isArray(c.sources) ? c.sources : [];
          const firstKind = sources.length > 0
            ? (sources[0].kind || sources[0].type || 'unknown')
            : 'unknown';
          const glyph = CONTACT_SRC_GLYPHS[firstKind] || '👤 ';
          const name = (c.name || c.id || '').toString();
          const lbl = `${glyph}${name}`.slice(0, 56);
          const srcTooltip = sources.length > 0
            ? sources.map(s => `${s.kind || s.type || '?'}${s.source_id ? `:${s.source_id}` : ''}`).join(' / ')
            : 'unknown source';
          const conf = Number(c.confidence || 0);
          const confStr = conf > 0 ? ` · conf ${conf.toFixed(2)}` : '';
          out.push({
            id: c.id, parent: 'mem-contacts', pos: [0, 0, 0], r: 0.30,
            base: MEM_BASE, hot: MEM_HOT, halo: 0,
            label: lbl, tier: 3,
            text: `${name} · ${srcTooltip}${confStr}`,
          });
        }
      }

      // mem-inbox: tier-2 sibling of mem-contacts that holds the
      // transactional / marketing / brand senders (newsletters,
      // notifications, order receipts, etc). Same render pattern as
      // contacts above, just a different glyph and cap so the bubble
      // doesn't blow up — gmail tends to have hundreds of these.
      const transactional = Array.isArray(mem.transactional) ? mem.transactional : [];
      if (transactional.length > 0) {
        const sortedTx = transactional.slice().sort((a, b) => {
          const ca = Number((a && a.confidence) || 0);
          const cb = Number((b && b.confidence) || 0);
          return cb - ca;
        });
        for (const c of sortedTx.slice(0, 40)) {
          if (!c || !c.id) continue;
          const sources = Array.isArray(c.sources) ? c.sources : [];
          const name = (c.name || c.id || '').toString();
          const lbl = `📨 ${name}`.slice(0, 56);
          const srcTooltip = sources.length > 0
            ? sources.map(s => typeof s === 'string'
                ? s
                : `${s.kind || s.type || '?'}${s.source_id ? `:${s.source_id}` : ''}`).join(' / ')
            : 'unknown source';
          out.push({
            id: c.id, parent: 'mem-inbox', pos: [0, 0, 0], r: 0.30,
            base: MEM_BASE, hot: MEM_HOT, halo: 0,
            label: lbl, tier: 3,
            text: `${name} · ${srcTooltip}`,
          });
        }
      }

      return out;
    }

    // ── Tool registry injection. Replaces the 5 hardcoded tier-2 tool
    // sub-nodes under cap-tools (tool-router/weather/open/msg/cal) with
    // the REAL list pulled from the live ToolRegistry by the launcher.
    // Tier-2 sub-nodes, orange tint matching cap-tools. Capped at 30
    // by the launcher (most-used first). If world.tools is empty we
    // return [] and the original hardcoded 5 stay in place.
    function worldToToolNodeDefs(world) {
      const out = [];
      const tools = world && Array.isArray(world.tools) ? world.tools : [];
      if (tools.length === 0) return out;
      const TOOL_BASE = 0xf5b542;
      const TOOL_HOT  = 0xfff0c0;
      for (const t of tools) {
        if (!t || !t.id) continue;
        out.push({
          id: `tool-${String(t.id).replace(/[^a-z0-9_-]/gi, '-')}`,
          parent: 'cap-tools', pos: [0, 0, 0], r: 0.55,
          base: TOOL_BASE, hot: TOOL_HOT, halo: TOOL_BASE,
          label: t.label || t.id, tier: 2,
          text: t.description || null,
        });
      }
      return out;
    }

    function applyWorldToNodeDefs(hardcoded, world) {
      // Collect hardcoded project roots + every descendant so we can
      // remove the whole demo subtree before splicing in the world's.
      const HARDCODED_PROJECT_ROOTS = new Set([
        'proj-touchless-dev', 'proj-touchless-web',
        'proj-touchless-track', 'proj-touchless-soc',
      ]);
      const removeIds = new Set(HARDCODED_PROJECT_ROOTS);

      // If the real tool registry is present, also strip the 5 hardcoded
      // tool sub-nodes under cap-tools so worldToToolNodeDefs() owns
      // that subtree. We do NOT remove cap-tools itself (still the tier-1
      // anchor); just its immediate hardcoded tier-2 children.
      const _toolsAvail = world && Array.isArray(world.tools) && world.tools.length > 0;
      if (_toolsAvail) {
        for (const id of ['tool-router', 'tool-weather', 'tool-open', 'tool-msg', 'tool-cal']) {
          removeIds.add(id);
        }
      }

      let changed = true;
      while (changed) {
        changed = false;
        for (const d of hardcoded) {
          if (d.parent && removeIds.has(d.parent) && !removeIds.has(d.id)) {
            removeIds.add(d.id);
            changed = true;
          }
        }
      }
      const kept = hardcoded.filter(d => !removeIds.has(d.id));
      // Memory leaves are spliced in alongside the project subtrees;
      // edge auto-creation (every def.parent → addEdgeOnce) picks them
      // up for free, so each new mem-* tier-2 sub-node gets a wire to
      // cap-memory and each leaf gets a wire to its sub-node.
      return [
        ...kept,
        ...worldToProjectNodeDefs(world),
        ...worldToMemoryNodeDefs(world),
        ...worldToToolNodeDefs(world),
      ];
    }

    const _W = window.IRIS_WORLD;
    const _HAS_PROJECTS = !!(_W && _W.projects && _W.projects.length > 0);
    const _HAS_MEMORY = !!(_W && _W.memory && (
      (Array.isArray(_W.memory.facts) && _W.memory.facts.length > 0) ||
      (Array.isArray(_W.memory.episodes) && _W.memory.episodes.length > 0) ||
      (Array.isArray(_W.memory.active_context) && _W.memory.active_context.length > 0) ||
      (Array.isArray(_W.memory.patterns) && _W.memory.patterns.length > 0)
    ));
    const _HAS_TOOLS = !!(_W && Array.isArray(_W.tools) && _W.tools.length > 0);
    const _USE_WORLD = _HAS_PROJECTS || _HAS_MEMORY || _HAS_TOOLS;
    const NODE_DEFS = _USE_WORLD
      ? applyWorldToNodeDefs(HARDCODED_NODE_DEFS, _W)
      : HARDCODED_NODE_DEFS;

    // Reflect data source in the panel badge.
    try {
      const badge = document.getElementById('data-badge');
      if (badge) {
        if (_USE_WORLD) {
          badge.textContent = `🌐 Real world data · ${_W.project_count} project(s)`;
          badge.style.color = '#1de9b6';
        } else {
          badge.textContent = 'Demo data (no cortex_world.json found)';
        }
      }
    } catch (e) { /* badge optional */ }

    // ── Tier-1 dynamic sizing ─────────────────────────────────────
    // Each tier-1 node (caps + projects) scales with the total number
    // of descendants (tier-2 + tier-3) under it. A cap/project with
    // many sub-nodes + leaves visibly grows; sparse ones stay near
    // their original radius. Formula: r_final = clamp(r_base * (1 +
    // 0.15 * log2(1 + descendant_count)), r_base, 2.5). Must run BEFORE
    // the spawn loop reads def.r — mesh geometry, halo size, and label
    // y-offset all derive from def.r. Tier-2 orbit also gets a small
    // bump (descendantBump) so leaves don't end up nested inside the
    // bigger parent sphere.
    (function applyTier1DescendantSizing() {
      // Index direct children by parent id (one pass over NODE_DEFS).
      const childrenByParent = new Map();
      for (const d of NODE_DEFS) {
        if (!d.parent) continue;
        if (!childrenByParent.has(d.parent)) childrenByParent.set(d.parent, []);
        childrenByParent.get(d.parent).push(d.id);
      }
      // BFS to count all descendants (tier-2 + tier-3) under a node.
      function descendantCount(id) {
        let total = 0;
        const stack = [id];
        while (stack.length) {
          const cur = stack.pop();
          const kids = childrenByParent.get(cur) || [];
          for (const k of kids) { total += 1; stack.push(k); }
        }
        return total;
      }
      // Split descendant count into direct (tier-2) children vs
      // grandchildren (tier-3 leaves). The orbit bump consumed by
      // updateOrbits below uses BOTH so we don't have to recompute,
      // but weights them very differently — siblings need to sit
      // farther apart, grandchildren only nudge the radius a bit so
      // each sub-cloud has breathing room.
      for (const d of NODE_DEFS) {
        if ((d.tier ?? 1) !== 1) continue;
        const direct = (childrenByParent.get(d.id) || []).length;
        let grand = 0;
        for (const cid of (childrenByParent.get(d.id) || [])) {
          grand += (childrenByParent.get(cid) || []).length;
        }
        const total = direct + grand;
        const rBase = d.r;
        const rTarget = rBase * (1 + 0.15 * Math.log2(1 + total));
        d.r = Math.min(2.5, Math.max(rBase, rTarget));
        d._descendantCount = total;       // legacy field, still read
        d._tier2ChildCount = direct;
        d._tier3GrandchildCount = grand;
      }
    })();

    // ── Bubble packing ────────────────────────────────────────────
    // Each tier-1 node "owns" a bubble of space containing all of its
    // descendants (tier-2 sub-cloud + tier-3 leaves). Sibling bubbles
    // must not overlap, or the visual hierarchy breaks down. We do
    // this by computing each tier-1's bubble radius and then choosing
    // an orbital distance from core that's far enough to fit the two
    // largest bubbles side-by-side at the worst plausible angular
    // separation.
    // Bubble-packing pass. Was an IIFE; named so the live-update
    // hook (OPEN_ISSUES #10) can re-run it after a new live project
    // node has been spliced into NODE_DEFS at runtime. Initial call
    // happens immediately below so the cold-start behavior is unchanged.
    function applyTier1BubblePacking() {
      // Tier-1 children of core (the only ones that orbit the core
      // directly — exclude any orphan tier-1 with a different parent).
      // Sort by id to MATCH the SIB_INDEX assignment downstream, which
      // also sorts by id. If the orderings don't match, the prediction
      // doesn't match the rendered position and pairs slip past us.
      const tier1Defs = NODE_DEFS
        .filter(d => (d.tier ?? 1) === 1 && d.parent === 'core')
        .slice()
        .sort((a, b) => (a.id < b.id ? -1 : (a.id > b.id ? 1 : 0)));
      if (tier1Defs.length < 1) return;

      // Bubble radius for a tier-1: distance from its center out to the
      // farthest possible point in its subtree, plus a safety margin.
      // Mirrors the descBump formula in updateOrbits so the prediction
      // matches what the orbit layout actually produces.
      const T2_BASE   = 2.5;   // tierRadius(2) — orbit of sub-nodes around tier-1
      const T3_BASE   = 1.0;   // tierRadius(3) — orbit of leaves around tier-2
      const T2_R      = 0.55;  // tier-2 sphere radius
      const T2_HALO   = 2.1;   // tier-2 haloMul (from TIER_LOOK[2])
      const LEAF_R    = 0.22;  // typical tier-3 sphere radius
      const MARGIN    = 3.5;   // breathing room between adjacent bubbles
      const SAFETY    = 1.10;  // small conservative buffer over the exact math
      function bubbleFor(d) {
        const kids  = d._tier2ChildCount || 0;
        const grand = d._tier3GrandchildCount || 0;
        let descBump = 1.0;
        if (kids > 0) {
          // KEEP IN SYNC with updateOrbits descBump (see updateOrbits @ ~line 1796).
          descBump = 1 + 0.09 * Math.log2(1 + kids) + 0.02 * Math.log2(1 + grand);
          if (descBump > 1.7) descBump = 1.7;
        }
        // Mirror updateOrbits' EXACT tier-2 orbital distance formula:
        //   baseRing2 = tierRadius(2)
        //   fit = autoFitRadius(centerR=d.r, siblings=kids-1)
        //   t2_orbit = (baseRing2 + max(0, fit - baseRing2*0.4)) * descBump
        // Previously this was just T2_BASE*descBump, which omitted the
        // autoFit contribution — for parents with many kids, autoFit added
        // ~1 unit of orbital distance that bubbleFor didn't see. Adjacent
        // bubbles meshed because of it.
        const baseRing2 = T2_BASE;
        const sibs2 = Math.max(0, kids - 1);
        const autoFit = Math.max(d.r * 1.35, 1.4 + Math.sqrt(Math.max(1, sibs2)) * 0.35);
        const t2_orbit = (baseRing2 + Math.max(0, autoFit - baseRing2 * 0.4)) * descBump;
        // Outer extent of a sub-cloud past the tier-2 center.
        const halo_extent = T2_R * T2_HALO;
        const leaf_extent = (grand > 0 ? T3_BASE + LEAF_R : T2_R);
        const t2_outer = Math.max(halo_extent, leaf_extent);
        // Bubble must enclose tier-1 sphere itself AND its sub-cloud.
        const subtreeExtent = t2_orbit + t2_outer;
        return Math.max(d.r, subtreeExtent) * SAFETY;
      }

      for (const d of tier1Defs) d._bubbleR = bubbleFor(d);

      // Seed: full-sphere Fibonacci spread, NO hemisphere bias (mixing
      // caps and projects evenly around the core looks more "spread
      // around the core" than hemisphere-segregated). Small id-hash
      // jitter so reload doesn't reshuffle but tied pairs differ.
      const N = tier1Defs.length;
      const positions = tier1Defs.map((d, i) => {
        const orb = fibonacciSphere(i, N);
        const [ja, jp] = idHash01(d.id);
        const a = (orb.angle + (ja - 0.5) * Math.PI * 0.30) % (Math.PI * 2);
        const p = Math.max(-Math.PI * 0.45, Math.min(Math.PI * 0.45,
                  orb.polar + (jp - 0.5) * Math.PI * 0.18));
        return {
          x: Math.cos(a) * Math.cos(p),
          y: Math.sin(p),
          z: Math.sin(a) * Math.cos(p),
        };
      });

      // Iterative angular repulsion. Each iter, find every too-close
      // pair (bubbles overlap at the current orbit radius) and push
      // them apart along the great-circle tangent. After convergence,
      // recompute the orbit radius from the still-tightest pair.
      let orbitR = 16.0;
      for (const d of tier1Defs) {
        orbitR = Math.max(orbitR, d._bubbleR * 2.2);   // initial guess
      }
      const STEP = 0.06;
      const ITERS = 200;   // was 120 — more headroom to reach tighter tolerance
      for (let iter = 0; iter < ITERS; iter++) {
        let maxOverlap = 0;
        for (let i = 0; i < N; i++) {
          for (let j = i + 1; j < N; j++) {
            const p1 = positions[i], p2 = positions[j];
            const dot = Math.max(-1, Math.min(1, p1.x*p2.x + p1.y*p2.y + p1.z*p2.z));
            const angle = Math.acos(dot);
            if (angle < 0.001) {
              // Coincident — nudge j by a tiny random tangent (id-hash
              // derived so it's deterministic).
              const [jx] = idHash01(tier1Defs[j].id + '!');
              const eps = 0.05 * (jx - 0.5);
              positions[j].x += eps; positions[j].z += eps;
            } else {
              const chord = 2 * orbitR * Math.sin(angle / 2);
              const needed = tier1Defs[i]._bubbleR + tier1Defs[j]._bubbleR + MARGIN;
              const overlap = needed - chord;
              if (overlap > 0) {
                if (overlap > maxOverlap) maxOverlap = overlap;
                // Tangent direction from i toward j (project p2-p1 onto
                // the tangent plane of p1, normalize). Then move both
                // along it in opposite directions.
                let dx = p2.x - p1.x, dy = p2.y - p1.y, dz = p2.z - p1.z;
                const len = Math.hypot(dx, dy, dz) || 1;
                dx /= len; dy /= len; dz /= len;
                const push = STEP * Math.min(1, overlap / orbitR + 0.05);
                positions[i].x -= dx * push; positions[i].y -= dy * push; positions[i].z -= dz * push;
                positions[j].x += dx * push; positions[j].y += dy * push; positions[j].z += dz * push;
              }
            }
            // Re-normalize to unit sphere.
            const n1 = Math.hypot(positions[i].x, positions[i].y, positions[i].z) || 1;
            positions[i].x /= n1; positions[i].y /= n1; positions[i].z /= n1;
            const n2 = Math.hypot(positions[j].x, positions[j].y, positions[j].z) || 1;
            positions[j].x /= n2; positions[j].y /= n2; positions[j].z /= n2;
          }
        }
        if (maxOverlap < 0.005) break;   // converged (was 0.02 — tighter)
      }

      // Final orbit radius — the tightest still-close pair after
      // repulsion dictates the minimum. Hard floor at 16.
      let requiredR = 16.0;
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const p1 = positions[i], p2 = positions[j];
          const dot = Math.max(-1, Math.min(1, p1.x*p2.x + p1.y*p2.y + p1.z*p2.z));
          const angle = Math.acos(dot);
          if (angle < 0.01) continue;
          const chord = tier1Defs[i]._bubbleR + tier1Defs[j]._bubbleR + MARGIN;
          const need = chord / (2 * Math.sin(angle / 2));
          if (need > requiredR) requiredR = need;
        }
      }
      let orbitR_final = requiredR;

      // Overlap-buster: one final O(N²) pass at orbitR_final. If any pair
      // STILL has a positive chord deficit (chord < needed), scale orbitR
      // up by (1 + worst_deficit / orbitR_final). This is a non-linear
      // last-resort correction that guarantees no residual overlap from
      // the iterative repulsion settling early. Loop up to 8 times in case
      // a single scale-up doesn't completely resolve a tight cluster.
      for (let bust = 0; bust < 8; bust++) {
        let worstDeficit = 0;
        for (let i = 0; i < N; i++) {
          for (let j = i + 1; j < N; j++) {
            const p1 = positions[i], p2 = positions[j];
            const dot = Math.max(-1, Math.min(1, p1.x*p2.x + p1.y*p2.y + p1.z*p2.z));
            const angle = Math.acos(dot);
            if (angle < 0.01) continue;
            const chord = 2 * orbitR_final * Math.sin(angle / 2);
            const needed = tier1Defs[i]._bubbleR + tier1Defs[j]._bubbleR + MARGIN;
            const deficit = needed - chord;
            if (deficit > worstDeficit) worstDeficit = deficit;
          }
        }
        if (worstDeficit <= 0.0001) break;   // no overlap left
        orbitR_final *= (1 + worstDeficit / orbitR_final);
      }

      // Cache the converged unit positions + final orbit radius on each
      // tier-1 def. deriveOrbit reads these directly so the rendered
      // position EXACTLY matches what the packing math optimized for.
      for (let i = 0; i < N; i++) {
        const p = positions[i];
        tier1Defs[i]._fixedAngle = Math.atan2(p.z, p.x);
        tier1Defs[i]._fixedPolar = Math.asin(Math.max(-1, Math.min(1, p.y)));
        tier1Defs[i]._orbitFromCoreR = orbitR_final;
      }
    }
    applyTier1BubblePacking();

    // Capability IDs (pinned-ring, not draggable, not part of the
    // free-floating tree).
    const CAPABILITY_IDS = new Set(['cap-memory', 'cap-voice', 'cap-tools', 'cap-realtime']);

    // Pre-group nodes by parent so we can give each sibling group
    // an even spread on the unit sphere via the Fibonacci-sphere
    // algorithm. Result: equidistant sibling spacing — no clumping,
    // no two nodes occupying the same latitude+longitude.
    const SIBS_BY_PARENT = {};
    for (const def of NODE_DEFS) {
      const pkey = def.parent || '__root__';
      (SIBS_BY_PARENT[pkey] ||= []).push(def);
    }
    // Stable order within each group so reload doesn't reshuffle.
    for (const pkey in SIBS_BY_PARENT) {
      SIBS_BY_PARENT[pkey].sort((a, b) => a.id.localeCompare(b.id));
    }
    const SIB_INDEX = {};   // id -> { i, n } sibling index within its parent group
    for (const pkey in SIBS_BY_PARENT) {
      const sibs = SIBS_BY_PARENT[pkey];
      for (let i = 0; i < sibs.length; i++) SIB_INDEX[sibs[i].id] = { i, n: sibs.length };
    }

    // Fibonacci-sphere distribution: returns (angle, polar) such that
    // siblings of the same parent occupy quasi-uniform points on their
    // shared orbital sphere. Even spacing in all directions = clean
    // satellite layout, no two nodes overlapping. n=1 collapses to the
    // pole (single child has no siblings to space against).
    function fibonacciSphere(i, n) {
      if (n <= 1) return { angle: 0, polar: 0 };
      const goldenAngle = Math.PI * (3.0 - Math.sqrt(5.0));
      const y = 1 - (i / (n - 1)) * 2;     // -1 .. +1
      const polar = Math.asin(Math.max(-1, Math.min(1, y)));
      const angle = (goldenAngle * i) % (Math.PI * 2);
      return { angle, polar };
    }

    // Deterministic per-id hash → two floats in [0,1). Used to jitter
    // every orbital position so n=1 children don't all collapse to
    // (angle:0, polar:0) — which made single-child chains render as
    // perfect collinear stacks (tier-1 → tier-2 → tier-3 all on the
    // +X axis from the core).
    function idHash01(id) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < (id || '').length; i++) {
        h ^= id.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      const a = (h & 0xffff) / 0x10000;
      const b = ((h >>> 16) & 0xffff) / 0x10000;
      return [a, b];
    }

    function deriveOrbit(def, parentDef) {
      void parentDef; // unused — orbit is now purely sibling-index-driven
      // Tier-1 children of core: use the cached position from the
      // bubble-packing pass (iterative repulsion already optimized
      // spacing). Skips Fibonacci+jitter for them entirely.
      if (def._fixedAngle !== undefined && def._fixedPolar !== undefined) {
        return { angle: def._fixedAngle, polar: def._fixedPolar };
      }
      const sib = SIB_INDEX[def.id] || { i: 0, n: 1 };
      const orb = fibonacciSphere(sib.i, sib.n);
      // Per-id jitter so siblings (and especially single-child chains)
      // never share an axis with their parent. Wider azimuthal jitter
      // than polar so the cloud reads as a sphere not a ring.
      const [ja, jp] = idHash01(def.id);
      orb.angle = (orb.angle + ja * Math.PI * 2) % (Math.PI * 2);
      orb.polar = orb.polar + (jp - 0.5) * (Math.PI * 0.45);     // ±~40°
      // Clamp polar to ±~80° so jitter never pushes nodes onto the
      // parent's pole (looks like they vanish from view).
      const maxP = Math.PI * 0.45;
      if (orb.polar >  maxP) orb.polar =  maxP;
      if (orb.polar < -maxP) orb.polar = -maxP;
      return orb;
    }

    const NODES = {};
    const NODE_LIST = [];   // iteration order for orbit recompute (parent-first guaranteed by NODE_DEFS order)
    const NODE_DEF_BY_ID = {};
    for (const d of NODE_DEFS) NODE_DEF_BY_ID[d.id] = d;

    for (const def of NODE_DEFS) {
      const tier = def.tier ?? 1;
      const look = TIER_LOOK[tier] || TIER_LOOK[1];

      // Tier 3 leaves use a plain MeshBasicMaterial — unlabeled
      // icy-light dots scattered in the satellite cloud. PERF: was
      // MeshStandardMaterial (PBR roughness/metalness + IBL sampling
      // per pixel); leaves are sub-pixel at overview zoom so the
      // shading difference is imperceptible, but the shader cost adds
      // up over ~166 spheres. Basic = flat unlit, single-fetch.
      let mat;
      if (tier >= 3) {
        mat = new THREE.MeshBasicMaterial({
          color: 0xd6e8f5, transparent: true, opacity: 0.85,
        });
      } else {
        mat = makePlasmaMat(Math.random() * 100, def.base, def.hot);
        mat.uniforms.uIntensity.value = 0.6 * look.intensityMul;
        mat.uniforms.uBodyAmp.value = 0.07 * look.bodyAmpMul;
        mat.uniforms.uSurfaceAmp.value = 0.04 * look.surfAmpMul;
      }

      // PERF: tier-3 icosahedron detail dropped from 2 (80 tris) to 1
      // (20 tris). At overview zoom each leaf is a few pixels; the
      // faceting is invisible. Saves ~10k triangles scene-wide.
      const detail = tier === 0 ? 5 : tier === 1 ? 4 : tier === 2 ? 3 : 1;
      const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(def.r, detail), mat);
      mesh.position.set(...def.pos);
      mesh.userData.nodeId = def.id;
      scene.add(mesh);

      let halo = null;
      if (look.haloMul > 0) {
        halo = makeHalo(def.halo || def.base, def.r * look.haloMul, look.haloOpacity);
        halo.position.set(...def.pos);
        scene.add(halo);
      }

      // Tier 2 sub-nodes get a dimmer label so they don't dominate the
      // satellite cloud at rest — they brighten on focus via the
      // applyFocusVisibility pass. Tier 3 leaf labels are LAZILY
      // created on first reveal (when their parent becomes focused)
      // — keeps the cloud uncluttered AND saves ~220 canvas-texture
      // GPU allocations + invisible per-frame draw calls until needed.
      // See applyFocusVisibility() for the lazy-create path.
      let label = null;
      let labelBaseOpacity = 0.92;
      if (tier <= 2) {
        const labelScale = tier === 0 ? 1.4
                          : tier === 1 ? 0.95
                          : 0.45;
        const labelOpacity = tier === 0 ? 0.92
                            : tier === 1 ? 0.92
                            : 0.55;
        labelBaseOpacity = labelOpacity;
        label = makeLabel(def.label, labelOpacity, labelScale);
        const yOff = tier === 0 ? 1.6 : 0.9;
        label.position.set(def.pos[0], def.pos[1] + def.r + yOff, def.pos[2]);
        scene.add(label);
      } else if (tier === 3) {
        // Defer creation — sprite stays null until applyFocusVisibility
        // detects this leaf's parent is the focused node for the first
        // time. labelBaseOpacity stays 0.0 so the legacy code path that
        // checks node.labelBaseOpacity continues to mean "hidden at rest".
        labelBaseOpacity = 0.0;
      }

      // Orbit init: derive starting angle/polar from the static
      // position (relative to parent), so the constellation starts
      // familiar then drifts.
      const parentDef = def.parent ? NODE_DEF_BY_ID[def.parent] : null;
      const orb = deriveOrbit(def, parentDef);

      const node = {
        id: def.id,
        parent: def.parent,
        label: def.label,
        tier,
        mesh, halo,
        labelSprite: label,
        labelBaseOpacity: labelBaseOpacity,
        mat,
        basePos: new THREE.Vector3(...def.pos),
        baseR: def.r,
        baseIntensity: (tier >= 3) ? 0.12 : mat.uniforms.uIntensity.value,
        baseBodyAmp:   (tier >= 3) ? 0 : mat.uniforms.uBodyAmp.value,
        baseSurfAmp:   (tier >= 3) ? 0 : mat.uniforms.uSurfaceAmp.value,
        lastFireAt: 0,
        baseColor: def.base, hotColor: def.hot,
        isCapability: CAPABILITY_IDS.has(def.id),
        // Tier-1 only: how many descendants this node has (set above
        // in applyTier1DescendantSizing). Used to push tier-2 children
        // outward proportionally so they don't end up inside the bigger
        // parent sphere. 0 for tier-0/2/3.
        descendantCount: (tier === 1 ? (def._descendantCount || 0) : 0),
        tier2ChildCount: (tier === 1 ? (def._tier2ChildCount || 0) : 0),
        tier3GrandchildCount: (tier === 1 ? (def._tier3GrandchildCount || 0) : 0),
        bubbleR: (tier === 1 ? (def._bubbleR || 0) : 0),
        orbitFromCoreR: (tier === 1 ? (def._orbitFromCoreR || 0) : 0),

        // ── orbit state ───────────────────────────────────────────
        orbitAngle: orb.angle,
        orbitPolar: orb.polar,
        // Slow drift (per-node randomized speed). Tier 0 doesn't drift
        // (it's the anchor). Tier 1 ALL drift at the SAME fixed rate so
        // sibling angular distance is preserved — different per-node
        // speeds would gradually push tier-1 nodes toward each other
        // and break bubble-packing over time. Tier 2/3 randomize for
        // liveliness; they orbit WITHIN their tier-1's bubble so even
        // sibling collisions stay inside the bubble.
        orbitSpeed: (tier === 0) ? 0
                   : (tier === 1) ? 0.04
                   : (0.03 + Math.random() * 0.05) * 1.2,
        // EQUIDISTANT — every sibling sits at the EXACT same distance
        // from its parent. Fibonacci-sphere distribution above already
        // spreads them out angularly, so siblings differ in direction
        // not altitude. Cleaner satellite-ring look.
        orbitRadiusMul: 1.0,

        // Per-mesh rotation — tiny per-axis spin gives bodies real 3D
        // motion. Tier 0 spins slowest (anchor); tier ≥ 2 doesn't spin
        // at all (those are tiny, would just look jittery).
        spinX: (tier === 0) ? 0.04 : (tier === 1 ? 0.08 + Math.random() * 0.10 : 0),
        spinY: (tier === 0) ? 0.06 : (tier === 1 ? 0.10 + Math.random() * 0.14 : 0),
        spinZ: (tier === 0) ? 0.02 : (tier === 1 ? 0.04 + Math.random() * 0.06 : 0),

        // Spring physics state (tier-1 only; tier ≥ 2 follow rigidly).
        target: new THREE.Vector3(...def.pos),
        velocity: new THREE.Vector3(),

        // Drag state.
        dragged: false,
      };
      NODES[def.id] = node;
      NODE_LIST.push(node);
    }

    // Helper: count direct children (used for camera distance + auto-fit).
    const childrenById = new Map();
    for (const n of NODE_LIST) {
      if (!n.parent) continue;
      if (!childrenById.has(n.parent)) childrenById.set(n.parent, []);
      childrenById.get(n.parent).push(n);
    }
    function childCount(id) {
      const list = childrenById.get(id);
      return list ? list.length : 0;
    }

    // PERF: precomputed sibling-count-by-orbit-center. Since
    // orbitCenterId(node) just returns node.parent || null and node
    // parentage doesn't change at runtime, this map is static for the
    // life of the scene. Used by updateOrbits() to replace an O(N²)
    // double loop (~31k iterations/frame at 178 nodes) with an O(1)
    // map lookup per node. If runtime add/remove ever happens, update
    // this map alongside NODES/NODE_LIST.
    const SIBLING_COUNT_BY_CENTER = new Map();
    for (const n of NODE_LIST) {
      const centerId = n.parent || null;
      if (centerId === null) continue;
      // We want "other nodes that share this center", so for each node
      // the sibling count is (group size - 1). Build group sizes first,
      // then subtract 1 at lookup time.
      SIBLING_COUNT_BY_CENTER.set(centerId, (SIBLING_COUNT_BY_CENTER.get(centerId) || 0) + 1);
    }

    // ─── edges (with peristaltic shader) ──────────────────────────
    // Each edge is a TubeGeometry whose ShaderMaterial accepts an
    // array of pulse positions + amplitudes. The vertex shader
    // displaces along the normal where pulses are — making the wire
    // visibly BULGE around each traveling pulse like a peristaltic
    // wave. The fragment shader colors the bulge brighter.
    const MAX_PULSES_PER_EDGE = 6;

    const EDGE_VS = `
      uniform float uPulses[${MAX_PULSES_PER_EDGE}];
      uniform float uPulseAmps[${MAX_PULSES_PER_EDGE}];
      uniform vec3  uPulseColors[${MAX_PULSES_PER_EDGE}];
      uniform int   uPulseCount;
      uniform float uBumpWidth;
      uniform float uMaxBump;

      varying vec3 vColorMix;
      varying float vBump;

      void main(){
        float u = uv.x;            // 0..1 along the tube length
        float totalBump = 0.0;
        vec3  colMix = vec3(0.0);
        float colWeight = 0.0;
        for (int i = 0; i < ${MAX_PULSES_PER_EDGE}; i++) {
          if (i >= uPulseCount) break;
          float d = u - uPulses[i];
          float w = uBumpWidth;
          float k = exp(-(d*d) / (w*w));
          float amp = uPulseAmps[i] * k;
          totalBump += amp;
          colMix += uPulseColors[i] * amp;
          colWeight += amp;
        }
        vBump = clamp(totalBump, 0.0, 1.0);
        vColorMix = colWeight > 1e-4 ? (colMix / colWeight) : vec3(0.29, 0.55, 0.69);
        vec3 displaced = position + normal * vBump * uMaxBump;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
      }
    `;
    const EDGE_FS = `
      uniform vec3 uBaseColor;
      uniform float uOpacity;
      varying vec3 vColorMix;
      varying float vBump;
      void main(){
        // Base color when no bump; lerp toward pulse color as it travels.
        vec3 col = mix(uBaseColor, vColorMix, smoothstep(0.0, 0.6, vBump));
        col *= (0.85 + vBump * 2.2);
        // Slight glow even at rest so the wire is visible
        gl_FragColor = vec4(col + vec3(0.02, 0.04, 0.06), uOpacity);
        if (uOpacity <= 0.001) discard;
      }
    `;

    const EDGES = [];   // each: { fromId, toId, material, mesh, pulses: [], curve, _tubeSegs, _tubeRadius }

    // Rebuild a tube geometry between two live node positions. Called
    // both on initial creation and once per frame to keep edges glued
    // to nodes as they orbit / are dragged.
    function buildEdgeGeometry(edge) {
      const fromNode = NODES[edge.fromId];
      const toNode = NODES[edge.toId];
      if (!fromNode || !toNode) return null;
      const a = fromNode.mesh.position.clone();
      const b = toNode.mesh.position.clone();
      const chord = b.clone().sub(a);
      const len = chord.length();
      if (len < 0.001) return null;
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const axis = Math.abs(chord.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      const perp = new THREE.Vector3().crossVectors(chord, axis).normalize();
      const outward = mid.clone().normalize();
      const bowAmount = 0.05 * len + 0.3;
      mid.addScaledVector(perp, bowAmount * 0.4);
      if (mid.lengthSq() > 0.01) mid.addScaledVector(outward, bowAmount * 0.6);
      const curve = new THREE.CatmullRomCurve3([a, mid, b]);
      return new THREE.TubeGeometry(curve, edge._tubeSegs, edge._tubeRadius, 8, false);
    }

    // Edge thickness tiered by deepest endpoint — wires get thinner
    // as you go further down the tree. core ↔ tier 1 = thickest;
    // tier 2 ↔ tier 3 = barely visible thread.
    function edgeTubeRadius(fromNode, toNode) {
      const deepestTier = Math.max(fromNode.tier ?? 1, toNode.tier ?? 1);
      if (deepestTier <= 1) return 0.13;   // core → caps/projects (slightly thicker)
      if (deepestTier === 2) return 0.05;   // cap/project → sub-nodes (slightly thinner)
      return 0.018;                         // sub-node → leaves (slightly thinner, still visible)
    }

    function addEdge(fromId, toId) {
      const fromNode = NODES[fromId];
      const toNode = NODES[toId];
      if (!fromNode || !toNode) { console.warn('addEdge: missing node', fromId, toId); return; }

      const deepestTier = Math.max(fromNode.tier ?? 1, toNode.tier ?? 1);
      const isLeafEdge = deepestTier >= 3;

      // ── Leaf edges: thin always-visible THREE.Line, NOT a Tube ────
      // PERF: leaves now have ~166 wires in the cloud; spawning each as
      // a TubeGeometry + ShaderMaterial blew the budget on idle render +
      // per-frame rebuild. Lines use a 2-vertex BufferGeometry and a
      // single LineBasicMaterial draw call. The pulse system skips leaf
      // edges (Lines have no peristaltic shader uniforms).
      if (isLeafEdge) {
        // Use the tier-2 parent's color so the leaf wires read as
        // "satellites of THIS sub-node" — color cohesion within each
        // cluster instead of a uniform muted-blue everywhere.
        const tier2Node = (fromNode.tier === 2) ? fromNode : (toNode.tier === 2 ? toNode : null);
        const lineColor = tier2Node ? (tier2Node.baseColor || 0x9cc8e0) : 0x9cc8e0;
        const lineMat = new THREE.LineBasicMaterial({
          color: lineColor,
          transparent: true,
          opacity: 0.25,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const lineGeom = new THREE.BufferGeometry();
        const positions = new Float32Array(6);
        positions[0] = fromNode.mesh.position.x;
        positions[1] = fromNode.mesh.position.y;
        positions[2] = fromNode.mesh.position.z;
        positions[3] = toNode.mesh.position.x;
        positions[4] = toNode.mesh.position.y;
        positions[5] = toNode.mesh.position.z;
        lineGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const lineMesh = new THREE.Line(lineGeom, lineMat);
        scene.add(lineMesh);
        EDGES.push({
          fromId, toId,
          material: lineMat,
          mesh: lineMesh,
          pulses: [],
          _isLeafEdge: true,
          _isLine: true,                    // distinguishes from tube edges
          _linePositions: positions,        // referenced each frame for in-place updates
          _opacityCurrent: 0.25,
        });
        return;
      }

      const tubeRadius = edgeTubeRadius(fromNode, toNode);
      // Deeper edges also get a slightly tighter pulse-bump amplitude
      // so the peristaltic wave is proportional to the wire diameter.
      const bumpAmp = tubeRadius < 0.04 ? 0.18 : tubeRadius < 0.08 ? 0.32 : 0.5;

      const mat = new THREE.ShaderMaterial({
        vertexShader: EDGE_VS, fragmentShader: EDGE_FS,
        uniforms: {
          uPulses:      { value: new Array(MAX_PULSES_PER_EDGE).fill(0) },
          uPulseAmps:   { value: new Array(MAX_PULSES_PER_EDGE).fill(0) },
          uPulseColors: { value: Array.from({length: MAX_PULSES_PER_EDGE}, () => new THREE.Color(0xffffff)) },
          uPulseCount:  { value: 0 },
          uBumpWidth:   { value: 0.06 },
          uMaxBump:     { value: bumpAmp },
          uBaseColor:   { value: new THREE.Color(0x2a4f73) },
          uOpacity:     { value: 1.0 },
        },
        transparent: true,
      });

      const edge = {
        fromId, toId,
        material: mat,
        mesh: null,
        pulses: [],
        _tubeSegs: 80,
        _tubeRadius: tubeRadius,
        _isLeafEdge: false,
        _isLine: false,
        _opacityCurrent: 1.0,
      };
      const geom = buildEdgeGeometry(edge);
      const mesh = new THREE.Mesh(geom || new THREE.BufferGeometry(), mat);
      edge.mesh = mesh;
      scene.add(mesh);
      EDGES.push(edge);
    }

    // Wire up the network — generic parent edges first (every node
    // with a parent gets one edge to that parent), then add the few
    // non-parent semantic links (user→mic input, realtime↔voice
    // cross-link) that aren't expressible as parent relationships.
    //
    // Dedup by sorted "a|b" key so we never double-wire an edge if a
    // semantic link happens to coincide with a parent edge.
    const _edgeKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
    const _edgeSeen = new Set();
    function addEdgeOnce(fromId, toId) {
      const k = _edgeKey(fromId, toId);
      if (_edgeSeen.has(k)) return;
      _edgeSeen.add(k);
      addEdge(fromId, toId);
    }

    // Parent edges for EVERY node (world-derived or hardcoded). This
    // is the fix for the old bug where world projects (proj-hgr-app-...,
    // proj-touchless-website, …) had nodes but no edge to core because
    // the previous PROJECT_TREE loop only knew the 4 hardcoded ids.
    for (const def of NODE_DEFS) {
      if (def.parent) addEdgeOnce(def.parent, def.id);
    }

    // Non-parent semantic links — user input chain + the realtime↔voice
    // cross-wire that lets cap-realtime route output through cap-voice's
    // TTS sub-node.
    addEdgeOnce('user', 'voice-mic');
    addEdgeOnce('rt-output', 'voice-tts');

    // ── Tool co-occurrence cross-edges (#7) ───────────────────────────
    // Purely additive: dashed THREE.Line between tier-3 tool nodes that
    // historically co-occur in the same session (from tool_call_log.db,
    // aggregated by run_iris_simulator.gather_tool_cooccurrence()).
    //
    // Does NOT touch the existing tier-3 leaf edges (solid LineBasic,
    // opacity 0.25) or the tier-1/2 TubeGeometry edges. New cross-edges
    // are stored in a separate array (TOOL_LINK_LINES) so the existing
    // rebuildAllEdgeGeometries() / pulse system can ignore them and so
    // the only per-frame cost is one position write per cross-edge.
    //
    // Color = midpoint of the two endpoints' base colors. Opacity scales
    // with weight (clamped to 0.15..0.5). LineDashedMaterial requires
    // computeLineDistances() per geometry for the dash pattern to render.
    const TOOL_LINK_LINES = [];
    (function buildToolLinkCrossEdges() {
      try {
        const links = (_W && Array.isArray(_W.tool_links)) ? _W.tool_links : [];
        if (links.length === 0) return;
        const _toolSlug = (s) => `tool-${String(s).replace(/[^a-z0-9_-]/gi, '-')}`;
        // Weight range for opacity mapping.
        let wMax = 1;
        for (const lk of links) { if ((lk.weight || 0) > wMax) wMax = lk.weight; }
        for (const lk of links) {
          const fromId = _toolSlug(lk.from);
          const toId   = _toolSlug(lk.to);
          const a = NODES[fromId];
          const b = NODES[toId];
          if (!a || !b) continue;
          // Skip self-loops (defensive — shouldn't happen).
          if (fromId === toId) continue;
          // Blend the two endpoint base colors for cohesion with both
          // clusters. Fallback to amber (tools default) if either side
          // is missing a baseColor.
          const cA = new THREE.Color(a.baseColor != null ? a.baseColor : 0xf5b542);
          const cB = new THREE.Color(b.baseColor != null ? b.baseColor : 0xf5b542);
          const blended = new THREE.Color(
            (cA.r + cB.r) * 0.5,
            (cA.g + cB.g) * 0.5,
            (cA.b + cB.b) * 0.5,
          );
          // Opacity ramps with weight: 0.15 at the floor, 0.5 at the
          // strongest pair this run. Keeps weak pairs whisper-thin so
          // strong correlations stand out.
          const wNorm = wMax > 1 ? (lk.weight - 1) / (wMax - 1) : 1;
          const opacity = 0.15 + (0.50 - 0.15) * Math.max(0, Math.min(1, wNorm));
          const lineMat = new THREE.LineDashedMaterial({
            color: blended,
            transparent: true,
            opacity: opacity,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            dashSize: 0.5,
            gapSize: 0.3,
            linewidth: 1,
          });
          const positions = new Float32Array(6);
          positions[0] = a.mesh.position.x;
          positions[1] = a.mesh.position.y;
          positions[2] = a.mesh.position.z;
          positions[3] = b.mesh.position.x;
          positions[4] = b.mesh.position.y;
          positions[5] = b.mesh.position.z;
          const lineGeom = new THREE.BufferGeometry();
          lineGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const lineMesh = new THREE.Line(lineGeom, lineMat);
          // REQUIRED for LineDashedMaterial — without this the line
          // renders solid (or invisible on some drivers).
          lineMesh.computeLineDistances();
          scene.add(lineMesh);
          TOOL_LINK_LINES.push({
            fromId, toId,
            mesh: lineMesh,
            material: lineMat,
            _positions: positions,
            weight: lk.weight || 1,
          });
        }
        if (TOOL_LINK_LINES.length > 0) {
          console.log(`[cortex] tool-link cross-edges: ${TOOL_LINK_LINES.length} dashed wires`);
        }
      } catch (e) {
        console.warn('[cortex] tool-link cross-edge build failed (non-fatal):', e);
      }
    })();

    function findEdge(fromId, toId) {
      for (const e of EDGES) {
        if ((e.fromId === fromId && e.toId === toId) ||
            (e.fromId === toId && e.toId === fromId)) return e;
      }
      return null;
    }

    // ─── pulse system (peristaltic) ────────────────────────────────
    const PULSE_DURATION = 180;      // ms per traversal
    // Bumped 1.0 → 1.8 because short pulses (180ms) need higher peak
    // brightness to stay visibly perceptible — at the old amp the
    // pulse traveled past too dim to spot.
    const PULSE_PEAK_AMP = 1.8;
    const COLORS = {
      cyan: new THREE.Color(0x58e3ff),
      amber: new THREE.Color(0xf5b542),
      magenta: new THREE.Color(0xb388ff),
      teal: new THREE.Color(0x1de9b6),
      pink: new THREE.Color(0xef7fc7),
      white: new THREE.Color(0xeaffff),
    };

    function firePulse(fromId, toId, colorName = 'cyan') {
      const edge = findEdge(fromId, toId);
      if (!edge) return null;
      // Leaf-edge Lines have no peristaltic shader — pulses can't
      // render along them. Silently skip; the prompt sequences only
      // ever fire on tier 0/1/2 edges anyway.
      if (edge._isLine) return null;
      // Direction along the edge: tube U=0 is at fromIdInEdge, U=1 at toIdInEdge.
      const dir = (edge.fromId === fromId) ? +1 : -1;
      const color = COLORS[colorName] || COLORS.cyan;
      const pulse = {
        dir, color, born: performance.now(),
        amp: 0, peakAmp: PULSE_PEAK_AMP,
        arrivedCb: null, arrived: false,
      };
      edge.pulses.push(pulse);
      // Brief flare on the SOURCE node (only for plasma nodes).
      const srcNode = NODES[fromId];
      if (srcNode && srcNode.mat.uniforms && srcNode.mat.uniforms.uIntensity) {
        srcNode.mat.uniforms.uIntensity.value = Math.min(2.2, srcNode.baseIntensity + 1.0);
        srcNode.mat.uniforms.uSurfaceAmp.value = Math.max(srcNode.baseSurfAmp, 0.10);
      }
      return pulse;
    }

    function updateEdgesAndPulses(now, dt) {
      const lerpK = Math.min(1, dt * 4);
      for (const edge of EDGES) {
        // Leaf-edge Lines have no shader uniforms and no pulse system.
        // Their opacity is fixed at construction (0.25) and their
        // positions are updated in rebuildAllEdgeGeometries(). Nothing
        // to do here — they're always visible.
        if (edge._isLine) continue;

        const u = edge.material.uniforms;

        // Non-leaf edges always target full opacity (their fade is
        // handled elsewhere by the existing per-node visibility system).
        u.uOpacity.value = 1.0;
        edge._opacityCurrent = 1.0;

        let count = 0;
        for (let i = edge.pulses.length - 1; i >= 0; i--) {
          const p = edge.pulses[i];
          const age = now - p.born;
          const t = Math.max(0, Math.min(1, age / PULSE_DURATION));
          const pos = (p.dir === 1) ? t : (1 - t);
          // Bell-curve amplitude — ramps up at the start, sustains, fades at the end.
          let envelope;
          if (t < 0.15) envelope = t / 0.15;
          else if (t < 0.85) envelope = 1.0;
          else envelope = 1.0 - (t - 0.85) / 0.15;
          const amp = p.peakAmp * envelope;

          if (t >= 1) {
            // Arrived — flare the dest, run the callback (for sequence chaining).
            const destId = (p.dir === 1) ? edge.toId : edge.fromId;
            const dest = NODES[destId];
            if (dest && dest.mat.uniforms && dest.mat.uniforms.uIntensity) {
              dest.mat.uniforms.uIntensity.value = Math.min(2.3, dest.baseIntensity + 1.0);
              dest.mat.uniforms.uSurfaceAmp.value = Math.max(dest.baseSurfAmp, 0.12);
            }
            if (p.arrivedCb && !p.arrived) { p.arrived = true; try { p.arrivedCb(); } catch (e) { console.error(e); } }
            edge.pulses.splice(i, 1);
            continue;
          }

          if (count < MAX_PULSES_PER_EDGE) {
            u.uPulses.value[count] = pos;
            u.uPulseAmps.value[count] = amp;
            u.uPulseColors.value[count].copy(p.color);
            count++;
          }
        }
        u.uPulseCount.value = count;
      }
    }

    // Rebuild every edge's TubeGeometry (or update Line positions) so
    // wires stay glued to nodes as they orbit / drag.
    //
    // Leaf edges are THREE.Line with a 2-vertex BufferGeometry; their
    // positions are updated in-place (no dispose/reassign) by writing
    // into the existing Float32Array + flipping needsUpdate. This is
    // the cheap path that lets us render all ~166 leaf wires every
    // frame at always-on low opacity without blowing the budget.
    //
    // Non-leaf (tube) edges still get a full TubeGeometry rebuild —
    // they're few in number and their peristaltic shader needs the
    // tube vertex normals.
    function rebuildAllEdgeGeometries() {
      for (const edge of EDGES) {
        if (edge._isLine) {
          const fromNode = NODES[edge.fromId];
          const toNode = NODES[edge.toId];
          if (!fromNode || !toNode) continue;
          const p = edge._linePositions;
          p[0] = fromNode.mesh.position.x;
          p[1] = fromNode.mesh.position.y;
          p[2] = fromNode.mesh.position.z;
          p[3] = toNode.mesh.position.x;
          p[4] = toNode.mesh.position.y;
          p[5] = toNode.mesh.position.z;
          edge.mesh.geometry.attributes.position.needsUpdate = true;
          continue;
        }
        const geom = buildEdgeGeometry(edge);
        if (!geom) continue;
        edge.mesh.geometry.dispose();
        edge.mesh.geometry = geom;
      }
      // Tool co-occurrence cross-edges (dashed). In-place position
      // write + computeLineDistances() — needed every frame so the
      // dash pattern reflows as endpoints drift. Cheap: 2 vertices,
      // typical edge count <= 60.
      for (const ce of TOOL_LINK_LINES) {
        const fromNode = NODES[ce.fromId];
        const toNode = NODES[ce.toId];
        if (!fromNode || !toNode) continue;
        const p = ce._positions;
        p[0] = fromNode.mesh.position.x;
        p[1] = fromNode.mesh.position.y;
        p[2] = fromNode.mesh.position.z;
        p[3] = toNode.mesh.position.x;
        p[4] = toNode.mesh.position.y;
        p[5] = toNode.mesh.position.z;
        ce.mesh.geometry.attributes.position.needsUpdate = true;
        ce.mesh.computeLineDistances();
      }
    }

    // ─── core state (idle / thinking / listening / speaking) ──────
    // Plasma shader uses uBaseColor + uHotColor for body + heat-map.
    // State changes re-tint both, which the user reads as Iris's
    // current activity.
    //
    // Intensities bumped from the original tuning so the core reads
    // as glowing-bright at all times (idle: 0.55 → 0.85; the active
    // states each got a +0.15 lift on top of their previous values).
    const CORE_STATES = {
      // Per UX spec:
      //   idle      = white glow
      //   listening = blue glow
      //   thinking  = orange/yellow glow (matches the orange thinking
      //               neuron pulses fired by the assistant window)
      //   speaking  = purple glow (matches the magenta core→output
      //               pulse fired on reply)
      // idle = dim white (session OFF / app sitting). Bumped DOWN
      // from 0.95 — was glowing too bright when nothing's happening.
      idle:      { base: 0xc8d2e0, hot: 0xeaf0ff, intensity: 0.35 },
      listening: { base: 0x58e3ff, hot: 0xc8f4ff, intensity: 1.00 },
      thinking:  { base: 0xf5b542, hot: 0xfff0c0, intensity: 1.05 },
      speaking:  { base: 0xb388ff, hot: 0xede0ff, intensity: 1.20 },
    };
    function setCoreState(name) {
      const c = CORE_STATES[name] || CORE_STATES.idle;
      const core = NODES['core'];
      if (!core) return;
      core.mat.uniforms.uBaseColor.value.setHex(c.base);
      core.mat.uniforms.uHotColor.value.setHex(c.hot);
      core.baseIntensity = c.intensity;
      core.mat.uniforms.uIntensity.value = c.intensity;
      core.halo.material.color.setHex(c.base);
    }
    // Apply the new idle intensity right away (the original ran at
    // uIntensity=0.6 until the first state change).
    setCoreState('idle');

    // ─── focus state machine ──────────────────────────────────────
    // Overview is the default: every node sits in its orbital
    // position. Clicking a parent enters focus mode: camera flies in,
    // that node's direct children grow + show labels, siblings dim.
    // Esc / dbl-click empty / IRIS breadcrumb returns to overview.
    let focusedNodeId = null;
    let cameraState = 'overview';        // overview | focusing | focused | unfocusing
    let cameraAnimStart = 0;
    const CAMERA_ANIM_MS = 1100;
    let cameraStartPos = null;
    let cameraStartTarget = null;
    let cameraEndPos = null;
    let cameraEndTarget = null;
    const cameraRestPos = new THREE.Vector3(0, 14, 56);
    const cameraRestTarget = new THREE.Vector3(0, 0, 0);

    function showBreadcrumb(label) {
      const el = document.getElementById('breadcrumb');
      const cur = document.getElementById('bc-current');
      if (el && cur) {
        cur.textContent = label;
        el.classList.add('visible');
      }
    }
    function hideBreadcrumb() {
      const el = document.getElementById('breadcrumb');
      if (el) el.classList.remove('visible');
    }

    function focusNode(id) {
      const node = NODES[id];
      if (!node) return;
      const kids = childCount(id);
      if (kids === 0) return;     // no children to expand
      focusedNodeId = id;
      cameraState = 'focusing';
      cameraAnimStart = performance.now();
      cameraStartPos = camera.position.clone();
      cameraStartTarget = controls.target.clone();
      const viewDir = new THREE.Vector3()
        .subVectors(camera.position, controls.target)
        .normalize();
      cameraEndTarget = node.mesh.position.clone();
      // Match the orbit auto-fit math, leave grandchild envelope room.
      const kidCount = kids;
      const expectedKidR = Math.max(3.0, 1.6 + Math.sqrt(Math.max(1, kidCount)) * 0.65) + 10.0;
      const grandchildEnvelope = 6.0;
      const camDistance = Math.max(36, (expectedKidR + grandchildEnvelope) * 2.4);
      cameraEndPos = cameraEndTarget.clone().addScaledVector(viewDir, camDistance);
      controls.enabled = false;
      showBreadcrumb(node.label);
    }

    function unfocusNode() {
      if (focusedNodeId === null && cameraState === 'overview') return;
      cameraState = 'unfocusing';
      cameraAnimStart = performance.now();
      cameraStartPos = camera.position.clone();
      cameraStartTarget = controls.target.clone();
      cameraEndPos = cameraRestPos.clone();
      cameraEndTarget = cameraRestTarget.clone();
      controls.enabled = false;
      hideBreadcrumb();
      focusedNodeId = null;
    }

    function topLevelAncestorId(node) {
      let cur = node.parent ? NODES[node.parent] : null;
      while (cur && cur.parent && cur.parent !== 'core') {
        cur = NODES[cur.parent];
      }
      return cur ? cur.id : null;
    }

    // Where should this node orbit RIGHT NOW?
    // Every level orbits its IMMEDIATE parent — tier 3 leaves orbit
    // their tier-2 sub-node, tier 2 sub-nodes orbit the project / cap,
    // tier 1 caps + projects orbit the core. With tight per-tier radii
    // this produces clusters-within-clusters (a moon system around
    // each sub-node), instead of leaves wandering loose around the
    // project on the far side of their actual semantic parent.
    function orbitCenterId(node) {
      return node.parent || null;
    }

    // Graded focus visibility: 0..1 for how prominently to show each
    // node. Overview = everything at 1.0; focus = focused subtree at
    // 1.0, parent at 0.70, siblings at 0.55, same-top-level cousins at
    // 0.50, unrelated top-levels at 0.18–0.20.
    function focusVisibility(node) {
      if (focusedNodeId === null) return 1.0;
      if (node.id === focusedNodeId) return 1.0;
      if (node.parent === focusedNodeId) return 1.0;

      const focused = NODES[focusedNodeId];
      if (focused) {
        const focusedParent = focused.parent;
        if (focusedParent && node.id === focusedParent) return 0.70;
        if (focusedParent && node.parent === focusedParent) return 0.55;
      }

      // Same top-level ancestor cousins stay at half visibility.
      const myTop = topLevelAncestorId(node);
      if (focused) {
        const focusedTop = focused.isCapability || !focused.parent
          ? focused.id
          : topLevelAncestorId(focused);
        if (myTop && myTop === focusedTop) return 0.50;
      }

      if (node.isCapability) return 0.20;
      if (!node.parent) return 0.22;
      return 0.20;
    }

    // ─── orbital layout ────────────────────────────────────────────
    // Each frame, compute a TARGET position for every node from its
    // parent's current position + (orbitAngle, orbitPolar, radius).
    // Tier ≥ 2 nodes snap rigidly to that target; tier 1 nodes use
    // a spring so they can be dragged.
    function tierRadius(tier) {
      // Tight per-tier radii so each level looks like satellites of
      // their parent: tier-2 sub-nodes ride ~2.5 from the project/cap
      // (≈ 2-3× parent radius); tier-3 leaves ride ~1.0 from their
      // tier-2 sub-node (≈ 2× tier-2's tiny radius). Whole tier-2
      // cluster including its tier-3 entourage orbits the project as
      // a coherent moon-system.
      if (tier === 1) return 16.0;
      if (tier === 2) return 2.5;
      if (tier >= 3) return 1.0;
      return 0;
    }

    // Auto-fit: more siblings → slightly wider ring so they don't
    // overlap. Coefficient dropped (was 0.65 → 0.35) so the auto-fit
    // doesn't blow out the cloud when a project has 11 descendants.
    function autoFitRadius(centerEffR, siblingCount) {
      const minClearance = centerEffR * 1.35;
      const autoFit = 1.4 + Math.sqrt(Math.max(1, siblingCount)) * 0.35;
      return Math.max(minClearance, autoFit);
    }

    function updateOrbits(now, dt) {
      for (const node of NODE_LIST) {
        // Core stays at the origin always.
        if (!node.parent) {
          node.mesh.position.set(0, 0, 0);
          node.target.set(0, 0, 0);
          continue;
        }

        // Drift the orbit angle (unless this node is currently
        // being dragged or it's the focused node — we want focus
        // to feel "anchored" while you study it).
        if (!node.dragged && node.id !== focusedNodeId) {
          node.orbitAngle += node.orbitSpeed * dt;
        }

        // Orbit center: in overview, tier 2/3 orbit their TOP-LEVEL
        // ancestor (cap or project) so the cloud forms around it
        // instead of branching out as a chain.
        const centerId = orbitCenterId(node);
        const center = centerId ? NODES[centerId] : null;
        if (!center) continue;
        const base = center.mesh.position;

        // Sibling count for auto-fit. PERF: O(1) map lookup (was an
        // O(N²) inner scan — ~31k iterations/frame at 178 nodes).
        // SIBLING_COUNT_BY_CENTER stores group size keyed by center
        // (parent) id; "siblings" excludes the node itself, hence -1.
        // Since orbitCenterId(node) === node.parent, this is exact.
        const siblings = Math.max(0, (SIBLING_COUNT_BY_CENTER.get(centerId) || 0) - 1);

        // Tier-1 nodes use the bubble-packed orbit radius (computed in
        // applyTier1BubblePacking) so sibling subtrees never overlap.
        // Other tiers use the default per-tier ring.
        const baseRing = (node.tier === 1 && node.orbitFromCoreR > 0)
          ? node.orbitFromCoreR
          : tierRadius(node.tier);
        const centerR = center.baseR || 1.0;
        const fit = autoFitRadius(centerR, siblings);
        // When the orbit center is the focused node, push direct kids
        // out so they read as distinct (smaller bonus now that the
        // baseline is tighter — was +10, scene-blowing at zoom).
        const focusBonus = (centerId === focusedNodeId) ? 5.0 : 0;
        // Tier-2 children of a content-heavy tier-1 parent get pushed
        // outward so they don't nest inside the bigger parent sphere
        // AND so siblings don't overlap each other. Log-based so a
        // 30-child cap (e.g. tools) doesn't fling kids to the moon:
        //   bump = 1 + 0.06 * log2(1 + tier2_children)
        //              + 0.015 * log2(1 + tier3_grandchildren)
        // For reference:
        //   3 kids,  0 leaves  → 1.12×
        //   6 kids, 145 leaves → 1.27×
        //   30 kids, 0 leaves  → 1.30×  (was 2.20× before — too far)
        // Clamped at 1.5× as a hard ceiling.
        let descBump = 1.0;
        if (node.tier === 2) {
          const kids = center.tier2ChildCount || 0;
          const grand = center.tier3GrandchildCount || 0;
          if (kids > 0) {
            // KEEP IN SYNC with bubbleFor descBump (see applyTier1BubblePacking).
            // Any change here MUST be mirrored there or bubble-packing predictions
            // diverge from the actual layout and tier-1 subtrees start overlapping.
            descBump = 1 + 0.09 * Math.log2(1 + kids) + 0.02 * Math.log2(1 + grand);
            if (descBump > 1.7) descBump = 1.7;
          }
        }
        const r = (baseRing + Math.max(0, fit - baseRing * 0.4) + focusBonus) * node.orbitRadiusMul * descBump;

        node.target.set(
          base.x + Math.cos(node.orbitAngle) * Math.cos(node.orbitPolar) * r,
          base.y + Math.sin(node.orbitPolar) * r,
          base.z + Math.sin(node.orbitAngle) * Math.cos(node.orbitPolar) * r,
        );

        if (node.dragged) continue;   // mouse owns the position

        // Tier 1: spring physics so drag feels weighted + bouncy.
        // Tier ≥ 2: snap rigidly to target so sub-clusters move as a
        // unit with their parent (no jiggle cascade).
        if (node.tier === 1) {
          const k = 6.0;       // spring stiffness
          const d = 4.0;       // damping
          const dx = node.target.x - node.mesh.position.x;
          const dy = node.target.y - node.mesh.position.y;
          const dz = node.target.z - node.mesh.position.z;
          node.velocity.x += (dx * k - node.velocity.x * d) * dt;
          node.velocity.y += (dy * k - node.velocity.y * d) * dt;
          node.velocity.z += (dz * k - node.velocity.z * d) * dt;
          node.mesh.position.x += node.velocity.x * dt;
          node.mesh.position.y += node.velocity.y * dt;
          node.mesh.position.z += node.velocity.z * dt;
        } else {
          node.mesh.position.copy(node.target);
        }
      }

      // After mesh positions settle, glue halos + labels back on top.
      // Skip position sync for invisible labels (Three.js short-circuits
      // them in render anyway, but the position.set() calls were the
      // single biggest CPU hot path with 220+ tier-3 sprites). The
      // lazy-create path in applyFocusVisibility seeds the sprite's
      // position before flipping visible=true, so first-frame snap is
      // avoided.
      for (const node of NODE_LIST) {
        if (node.halo) node.halo.position.copy(node.mesh.position);
        if (!node.labelSprite || !node.labelSprite.visible) continue;
        const yOff = node.baseR + (
          node.tier === 0 ? 1.6
          : node.tier === 3 ? 0.5
          : 0.9
        );
        node.labelSprite.position.set(
          node.mesh.position.x,
          node.mesh.position.y + yOff,
          node.mesh.position.z,
        );
      }
    }

    function applyFocusVisibility() {
      // Fade opacity + scale subtly based on focusVisibility.
      // Direct children of focus also temporarily reveal their labels
      // (tier-3 leaves don't have one, so they just brighten).
      for (const node of NODE_LIST) {
        const v = focusVisibility(node);
        // Plasma intensity scales with v; halos fade out for hidden.
        if (node.mat.uniforms && node.mat.uniforms.uIntensity) {
          // Scale the baseline (the per-frame decay in `frame` will
          // lerp toward this).
          // Note: we don't touch baseIntensity (state-machine owns it),
          // just modulate via halo + label opacity below.
        }
        if (node.halo) {
          const tierBase = (TIER_LOOK[node.tier] || TIER_LOOK[1]).haloOpacity;
          node.halo.material.opacity = tierBase * Math.max(0.05, v);
        }
        // Compute what the target opacity WOULD be for this node's
        // label, regardless of whether the sprite exists yet. We use
        // this to decide whether to lazily create a tier-3 sprite.
        let targetOpacity;
        if (node.tier === 3) {
          targetOpacity = (focusedNodeId !== null && node.parent === focusedNodeId)
            ? 0.85
            : 0.0;
        } else {
          targetOpacity = node.labelBaseOpacity * Math.max(0.05, v);
        }

        // ── lazy tier-3 sprite creation ────────────────────────────
        // Tier-3 leaves don't get a label sprite at spawn (saves ~220
        // canvas-texture allocations + GPU memory). Create on first
        // reveal — when this leaf's direct parent becomes the focused
        // node. Seed the sprite position from the current mesh pos so
        // it doesn't snap from origin on first render.
        if (node.tier === 3 && !node.labelSprite && targetOpacity > 0.01) {
          const sprite = makeLabel(node.label, 0.0, 0.32, 'small');
          const yOff = node.baseR + 0.5;
          sprite.position.set(
            node.mesh.position.x,
            node.mesh.position.y + yOff,
            node.mesh.position.z,
          );
          // Seed scale baselines so focus-bump code reads them correctly
          // the first time it touches this sprite.
          node.labelSprite = sprite;
          scene.add(sprite);
        }

        if (node.labelSprite) {
          // Tier-3 leaf labels start invisible (labelBaseOpacity = 0) and
          // only reveal when their direct parent is the focused node.
          // Smoothly lerp toward the target opacity so the transition
          // doesn't snap when focus changes.
          const curOpacity = node.labelSprite.material.opacity;
          const newOpacity = curOpacity + (targetOpacity - curOpacity) * 0.12;
          node.labelSprite.material.opacity = newOpacity;
          // Toggle .visible so Three.js skips render + traversal entirely
          // for off-screen labels. Threshold 0.02 prevents flicker as the
          // lerp settles. Applied to ALL tiers so tier-2 sub-labels also
          // skip render when their branch is hidden.
          const shouldShow = newOpacity > 0.02;
          if (node.labelSprite.visible !== shouldShow) {
            if (shouldShow) {
              // About to reveal — sync position BEFORE marking visible
              // so the next frame's render uses the correct location
              // (per-frame position-sync loop now skips invisible sprites).
              const yOff = node.baseR + (
                node.tier === 0 ? 1.6
                : node.tier === 3 ? 0.5
                : 0.9
              );
              node.labelSprite.position.set(
                node.mesh.position.x,
                node.mesh.position.y + yOff,
                node.mesh.position.z,
              );
            }
            node.labelSprite.visible = shouldShow;
          }
        }
        // Direct children of focus pop slightly larger (visual lift).
        let targetScale = 1.0;
        if (focusedNodeId !== null && node.parent === focusedNodeId) targetScale = 1.25;
        if (focusedNodeId === node.id) targetScale = 1.10;
        const cs = node.mesh.scale.x;
        const ns = cs + (targetScale - cs) * 0.15;
        node.mesh.scale.setScalar(ns);
      }
    }

    // ─── sequence player ────────────────────────────────────────────
    let sequenceRunning = false;

    function setStatus(msg, cls = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls;
    }

    function playSequence(steps, onComplete) {
      sequenceRunning = true;
      document.querySelectorAll('.prompt-btn').forEach(b => b.disabled = true);
      let i = 0;
      const next = () => {
        if (i >= steps.length) {
          sequenceRunning = false;
          document.querySelectorAll('.prompt-btn').forEach(b => b.disabled = false);
          if (onComplete) onComplete();
          return;
        }
        const step = steps[i++];
        setTimeout(() => {
          const pulse = firePulse(step.from, step.to, step.color || 'cyan');
          if (pulse) {
            pulse.arrivedCb = next;
          } else {
            // Edge not found — skip and continue
            console.warn('skip step', step);
            next();
          }
        }, step.delay || 0);
      };
      next();
    }

    // ─── test prompts ───────────────────────────────────────────────
    // Each prompt: scripted firing path + optional memory cache + response text.
    // Sequences start AT the core (input is text/click, not voice).
    // The user / mic / voice-tts chain is only used when speech input
    // arrives — these clicked prompts originate from the core itself.
    // Output still routes through rt-output → voice-tts so the user
    // hears the reply.
