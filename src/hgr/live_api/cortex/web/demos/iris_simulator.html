<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Iris Cortex — Live Simulator</title>
  <!-- Embedded-mode marker. Runs BEFORE <style> + <body> are parsed so
       the embedded CSS rules below match on first paint (no test-prompt
       flash). window.IRIS_EMBEDDED is injected at DocumentCreation by
       the launcher / assistant window when the page is hosted inside a
       Qt window. Standalone browser loads leave the class unset. -->
  <script>
    try {
      if (window.IRIS_EMBEDDED) {
        document.documentElement.classList.add('iris-embedded');
      }
    } catch (e) { /* no-op */ }
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #050a14 !important; color: #C8E6FF; overflow: hidden; height: 100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    /* Defensive: paint the GL canvas surface dark-blue at the CSS level
       so the GPU framebuffer never flashes black on focus-loss/regain
       cycles before Three.js's renderer.setClearColor fires. */
    #canvas { position: absolute; inset: 0; background: #050a14 !important; }
    html, body, #canvas { background-color: #050a14 !important; }
    #panel { position: absolute; top: 18px; left: 18px; background: rgba(6,16,30,0.78); border: 1px solid rgba(88,227,255,0.30); border-radius: 10px; padding: 14px 18px; font-size: 13px; min-width: 320px; max-width: 360px; z-index: 10; }
    #panel h1 { font-size: 12px; letter-spacing: 3px; color: #58E3FF; margin: 0 0 4px 0; font-weight: 800; text-transform: uppercase; }
    #panel .sub { color: rgba(200,230,255,0.55); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
    .prompt-btn { display: block; width: 100%; text-align: left; background: rgba(88,227,255,0.08); border: 1px solid rgba(88,227,255,0.30); color: #C8E6FF; padding: 9px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; margin-bottom: 6px; transition: background 120ms, border 120ms; }
    .prompt-btn:hover { background: rgba(88,227,255,0.18); border-color: rgba(88,227,255,0.55); }
    .prompt-btn:disabled { opacity: 0.4; cursor: wait; }
    .prompt-btn .resp { display: block; color: rgba(200,230,255,0.55); font-size: 10px; margin-top: 4px; font-style: italic; }
    #status { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: rgba(200,230,255,0.6); min-height: 20px; }
    #status.speaking { color: #B388FF; }
    #status.firing { color: #58E3FF; }
    #status.error { color: #EF7F7F; }
    label.row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 0; font-size: 11px; color: rgba(200,230,255,0.7); }
    label.row input { transform: scale(1.1); margin-left: 8px; }
    .back { position: absolute; top: 18px; right: 18px; color: rgba(200,230,255,0.6); text-decoration: none; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; z-index: 10; }
    .back:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
    #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); color: rgba(200,230,255,0.45); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; }

    /* Breadcrumb — appears when a node is focused.
       IRIS chip is clickable to return to overview. */
    #breadcrumb {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(200, 230, 255, 0.55);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 11;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease-out;
      user-select: none;
    }
    #breadcrumb.visible { opacity: 1; pointer-events: auto; }
    #breadcrumb .bc-crumb {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid rgba(88, 227, 255, 0.25);
      border-radius: 12px;
      color: rgba(200, 230, 255, 0.85);
      background: rgba(8, 16, 28, 0.55);
      cursor: pointer;
      transition: background 120ms ease-out, border 120ms ease-out, color 120ms ease-out;
    }
    #breadcrumb .bc-crumb:hover {
      background: rgba(88, 227, 255, 0.12);
      border-color: rgba(88, 227, 255, 0.55);
      color: #d8f4ff;
    }
    #breadcrumb #bc-current {
      cursor: default;
      background: rgba(88, 227, 255, 0.08);
      border-color: rgba(88, 227, 255, 0.35);
      color: #58e3ff;
    }
    #breadcrumb .bc-sep {
      color: rgba(200, 230, 255, 0.35);
      padding: 0 2px;
    }

    /* Hover label (follows mouse). */
    #hover-label {
      position: absolute;
      pointer-events: none;
      background: rgba(8, 16, 28, 0.85);
      border: 1px solid rgba(88, 227, 255, 0.35);
      color: #d8f4ff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 12;
      opacity: 0;
      transition: opacity 100ms ease-out;
    }
    #hover-label.visible { opacity: 1; }

    /* Suggestions panel — top-right overlay listing IRIS proactive
       suggestions. Hidden when window.IRIS_WORLD.suggestions is empty.
       Toggle with 's' key (mirrors 'b' bubble debug toggle). */
    #suggestions-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 280px;
      max-height: 60vh;
      overflow-y: auto;
      background: rgba(8, 14, 26, 0.82);
      border: 1px solid rgba(180, 140, 255, 0.25);
      border-radius: 10px;
      padding: 12px 14px;
      color: #d8e6ff;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 12px;
      z-index: 9;
      pointer-events: auto;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      display: none;
    }
    #suggestions-panel.visible { display: block; }
    #suggestions-panel .hdr {
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #b388ff;
      margin: 0 0 10px 0;
      font-weight: 800;
      text-transform: uppercase;
    }
    #suggestions-panel .items { display: flex; flex-direction: column; gap: 6px; }
    #suggestions-panel .sug {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(180, 140, 255, 0.08);
      border: 1px solid rgba(180, 140, 255, 0.22);
      border-radius: 6px;
      cursor: pointer;
      transition: background 120ms, border 120ms;
    }
    #suggestions-panel .sug:hover {
      background: rgba(180, 140, 255, 0.18);
      border-color: rgba(180, 140, 255, 0.50);
    }
    #suggestions-panel .sug .glyph { font-size: 16px; flex-shrink: 0; line-height: 1; }
    #suggestions-panel .sug .label {
      flex: 1;
      font-size: 12px;
      color: #d8e6ff;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #suggestions-panel .sug .why {
      font-size: 10px;
      color: rgba(200, 220, 255, 0.55);
      cursor: help;
      flex-shrink: 0;
      padding: 1px 6px;
      border: 1px solid rgba(180, 140, 255, 0.25);
      border-radius: 8px;
    }
    #suggestions-panel .sug .why:hover { color: #d8e6ff; border-color: rgba(180, 140, 255, 0.55); }
    /* Subtle scrollbar to fit the cortex aesthetic. */
    #suggestions-panel::-webkit-scrollbar { width: 6px; }
    #suggestions-panel::-webkit-scrollbar-track { background: transparent; }
    #suggestions-panel::-webkit-scrollbar-thumb {
      background: rgba(180, 140, 255, 0.25);
      border-radius: 3px;
    }

    /* Embedded mode — the page is hosted inside the Touchless / Cortex
       Qt window (run_iris_simulator.py injects window.IRIS_EMBEDDED=true
       at DocumentCreation). Hide all interactive UI chrome so the canvas
       reads as a pure visualization surface; the live bridge drives all
       activity instead of the test-prompt buttons. Standalone (browser)
       loads have IRIS_EMBEDDED undefined and remain fully interactive. */
    /* Both selectors (html.iris-embedded set in <head> inline script
       BEFORE first paint; body.embedded set later by the module script
       for any legacy entry point) so the rules always apply. */
    html.iris-embedded #panel,
    body.embedded #panel { display: none !important; }
    html.iris-embedded #suggestions-panel,
    body.embedded #suggestions-panel { display: none !important; }
    html.iris-embedded #breadcrumb,
    body.embedded #breadcrumb { display: none !important; }
    html.iris-embedded #hint,
    body.embedded #hint { display: none !important; }
    html.iris-embedded .back,
    body.embedded .back { display: none !important; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
  </script>
  <!-- QWebChannel transport. Bundled by Qt; loaded via qrc:// when the
       page is running under run_iris_simulator.py / CortexWindow. The
       launcher (run_iris_simulator.py) ALSO inlines the same source at
       DocumentCreation so the module script below can reference
       `QWebChannel` synchronously without waiting for this <script>
       to resolve. Either path is sufficient — if both succeed the
       second definition is harmlessly identical. -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <a class="back" href="./index.html">← all demos</a>
  <div id="breadcrumb">
    <span class="bc-crumb" data-bc-home>IRIS</span><span class="bc-sep"> › </span><span class="bc-crumb" id="bc-current"></span>
  </div>
  <div id="hover-label"></div>
  <div id="suggestions-panel">
    <div class="hdr">✦ IRIS SUGGESTS</div>
    <div class="items"></div>
  </div>
  <div id="panel">
    <h1>Iris Live Simulator</h1>
    <div id="data-badge" style="font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(200,230,255,0.55); margin: 2px 0 8px 0;">Demo data</div>
    <div class="sub">Click a test prompt to fire the path</div>
    <button class="prompt-btn" data-prompt="0">
      What's the weather?
      <span class="resp">→ tools/weather · no memory (changes)</span>
    </button>
    <button class="prompt-btn" data-prompt="1">
      Send the weather to Vesko
      <span class="resp">→ weather + memory/contacts + messages · caches Vesko</span>
    </button>
    <button class="prompt-btn" data-prompt="2">
      Open Chrome
      <span class="resp">→ Layer-0 router (fast path, no LLM)</span>
    </button>
    <button class="prompt-btn" data-prompt="3">
      Remember my dog's name is Rex
      <span class="resp">→ memory/write · caches "Rex"</span>
    </button>
    <button class="prompt-btn" data-prompt="4">
      What's my dog's name?
      <span class="resp">→ memory/recall</span>
    </button>
    <button class="prompt-btn" data-prompt="5">
      Schedule meeting tomorrow at 3
      <span class="resp">→ tools/calendar (Microsoft connector)</span>
    </button>
    <label class="row">Voice replies
      <input type="checkbox" id="tts-on" checked />
    </label>
    <label class="row" style="margin-top: 6px; align-items: stretch; flex-direction: column;">
      <span style="margin-bottom: 4px;">Voice</span>
      <select id="voice-select" style="background: rgba(8,16,28,0.85); color: #C8E6FF; border: 1px solid rgba(88,227,255,0.3); padding: 5px 6px; border-radius: 5px; font-size: 11px;"></select>
    </label>
    <div id="status">Idle.</div>
  </div>
  <div id="hint">Drag to orbit · scroll to zoom · click a node to focus · Esc to return</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ─── embedded mode ─────────────────────────────────────────────
    // run_iris_simulator.py (CortexWindow) injects
    //   window.IRIS_EMBEDDED = true
    // at DocumentCreation when the page is hosted inside the Qt
    // window. We toggle a body class so the embedding CSS rules (see
    // <style>) can hide the test-prompts panel, suggestions overlay,
    // breadcrumb, hint, and back-link — leaving a clean visualization
    // surface driven entirely by the live cortex bridge. Standalone
    // (browser) loads see undefined and keep the full UI for testing.
    if (window.IRIS_EMBEDDED) {
      try { document.body.classList.add('embedded'); } catch (_) { /* non-fatal */ }
    }

    // ─── renderer + scene ──────────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.setClearColor(0x050a14, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    // Match page CSS background (#050a14) so any render-target reset flashes the
    // surrounding UI color instead of pure black (anti-flash on resize / composer realloc).
    scene.background = new THREE.Color(0x050a14);
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 250);
    camera.position.set(0, 14, 56);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0x101830, 0.16));
    const sun = new THREE.PointLight(0xb6dcff, 2.6, 260, 1.3);
    sun.position.set(0, 0, 0);
    scene.add(sun);

    // ─── plasma shader (same as plasma_core demo, reused) ──────────
    const NOISE = `
      vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + 1.0 * C.xxx;
        vec3 x2 = x0 - i2 + 2.0 * C.xxx;
        vec3 x3 = x0 - 1. + 3.0 * C.xxx;
        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(
                   i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }
    `;
    const PLASMA_VS = `
      uniform float uTime, uBodyAmp, uSurfaceAmp, uSeed;
      varying vec3 vNormal; varying float vNoise; varying vec3 vViewPosition;
      ${NOISE}
      vec3 displace(vec3 p) {
        float n1 = snoise(p * 0.35 + vec3(uSeed) + uTime * 0.25);
        float n2 = snoise(p * 2.00 + vec3(uSeed*2.7) + uTime * 1.50);
        return p + normalize(p) * (n1 * uBodyAmp + n2 * uSurfaceAmp);
      }
      vec3 ortho(vec3 v){ return normalize(abs(v.x) > abs(v.z) ? vec3(-v.y, v.x, 0.0) : vec3(0.0, -v.z, v.y)); }
      void main(){
        vec3 d = displace(position);
        float eps = 0.001;
        vec3 t1 = ortho(normal); vec3 t2 = normalize(cross(normal, t1));
        vec3 d1 = displace(position + t1 * eps) - d;
        vec3 d2 = displace(position + t2 * eps) - d;
        vNormal = normalize(cross(d1, d2));
        vNoise = snoise(position * 2.0 + vec3(uSeed*2.7) + uTime * 1.5);
        vec4 mv = modelViewMatrix * vec4(d, 1.0);
        vViewPosition = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `;
    const PLASMA_FS = `
      uniform vec3 uBaseColor, uHotColor;
      uniform float uIntensity;
      uniform float uAlpha;
      varying vec3 vNormal; varying float vNoise; varying vec3 vViewPosition;
      void main(){
        vec3 N = normalize(vNormal); vec3 V = normalize(vViewPosition);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 2.0);
        float heat = smoothstep(-0.4, 0.7, vNoise);
        vec3 col = mix(uBaseColor, uHotColor, heat);
        col *= (0.45 + 0.55 * uIntensity);
        col += vec3(0.25, 0.6, 1.0) * fres * 0.6 * uIntensity;
        // uAlpha is a dedicated fade channel driven by the project-removal
        // tween. Normal display keeps it at 1.0; the fade-out path drops
        // it toward 0 so the sphere goes genuinely translucent (not just
        // dimmer-colored — uIntensity already dimmed color, but a fixed
        // alpha=1.0 made the sphere stay fully opaque, producing the
        // "snap disappear" symptom when teardown finally ran).
        gl_FragColor = vec4(col, clamp(uAlpha, 0.0, 1.0));
      }
    `;
    function makePlasmaMat(seed, base, hot) {
      return new THREE.ShaderMaterial({
        vertexShader: PLASMA_VS, fragmentShader: PLASMA_FS,
        // transparent=true is required for the uAlpha fade to actually
        // composite against the scene; without it the fragment's alpha
        // is ignored and the sphere snaps off when we tear it down.
        transparent: true,
        uniforms: {
          uTime:       { value: 0 },
          uBodyAmp:    { value: 0.07 },
          uSurfaceAmp: { value: 0.04 },
          uIntensity:  { value: 0.6 },
          uAlpha:      { value: 1.0 },
          uBaseColor:  { value: new THREE.Color(base) },
          uHotColor:   { value: new THREE.Color(hot) },
          uSeed:       { value: seed },
        },
      });
    }

    // ─── halo sprite (shared) ──────────────────────────────────────
    const haloTex = (() => {
      const c = document.createElement('canvas'); c.width = 128; c.height = 128;
      const g = c.getContext('2d').createRadialGradient(64,64,0,64,64,64);
      g.addColorStop(0, 'rgba(255,255,255,0.85)');
      g.addColorStop(0.2, 'rgba(255,255,255,0.42)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.10)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
      const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
    })();
    function makeHalo(color, size, opacity = 0.6) {
      const m = new THREE.SpriteMaterial({
        map: haloTex, color, transparent: true, opacity,
        depthWrite: false, blending: THREE.AdditiveBlending,
      });
      const s = new THREE.Sprite(m);
      s.scale.set(size, size, 1);
      return s;
    }

    function makeLabel(text, opacity = 0.92, scale = 1.0, sizeHint = 'large') {
      // High-DPI label: 2x resolution + max anisotropy = crisp text
      // even at glancing angles. Was 512x128 + 44px font (fuzzy at
      // anything past mid-distance).
      //
      // sizeHint: 'large' (default, 1024x256 — tier 0/1/2 readable from
      // distance) or 'small' (256x64 — tier-3 leaves, tiny + only ever
      // visible when their parent is the focused node so reduced
      // resolution is unnoticed and saves ~16x GPU VRAM per sprite).
      const small = (sizeHint === 'small');
      const BASE_W = small ? 256 : 1024;
      const H = small ? 64  : 256;
      const FONT = small ? 40 : 92;
      const STROKE = small ? 4 : 14;
      const PAD = 16; // padding on each side of the text inside the canvas

      // Measure text on a throwaway ctx so we can grow the canvas width
      // to fit long labels (e.g. tier-1 project names) instead of letting
      // them clip silently against the fixed sprite bounds.
      const measureCtx = document.createElement('canvas').getContext('2d');
      measureCtx.font = `bold ${FONT}px -apple-system, Segoe UI, Roboto, sans-serif`;
      const textW = measureCtx.measureText(text).width;
      const needed = Math.ceil(textW + STROKE * 2 + PAD * 2);
      const W = Math.max(BASE_W, needed);
      const cx = W / 2, cy = H / 2;

      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.font = `bold ${FONT}px -apple-system, Segoe UI, Roboto, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = STROKE;
      ctx.strokeStyle = 'rgba(2,6,14,0.98)';
      ctx.strokeText(text, cx, cy);
      // Muted fill — luminance ~0.50, below the 0.70 bloom threshold
      // so labels stay sharp instead of glowing.
      ctx.fillStyle = 'rgba(135, 155, 178, 1.0)';
      ctx.fillText(text, cx, cy);
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.needsUpdate = true;
      const s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tex, transparent: true, depthWrite: false, opacity,
      }));
      // Scale sprite width proportional to canvas growth so the on-screen
      // text height stays constant — only the sprite gets wider for long
      // labels. Default base scale is 7 (large) / 1.75 (height).
