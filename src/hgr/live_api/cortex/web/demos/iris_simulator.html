          { from: 'mem-personal', to: 'cap-memory', color: 'magenta', delay: 200 },
          { from: 'cap-memory', to: 'core',         color: 'magenta' },
          { from: 'core', to: 'cap-realtime',       color: 'magenta' },
          { from: 'cap-realtime', to: 'rt-output',  color: 'magenta' },
          { from: 'rt-output', to: 'voice-tts',     color: 'magenta' },
        ],
      },
      {
        label: "Schedule meeting tomorrow at 3",
        response: "Done. Meeting tomorrow at 3.",
        steps: [
          { from: 'core', to: 'cap-realtime',       color: 'amber' },
          { from: 'cap-realtime', to: 'rt-planner', color: 'amber' },
          { from: 'rt-planner', to: 'cap-realtime', color: 'amber', delay: 250 },
          { from: 'cap-realtime', to: 'core',       color: 'amber' },
          { from: 'core', to: 'cap-tools',          color: 'amber' },
          { from: 'cap-tools', to: 'tool-cal',      color: 'amber' },
          { from: 'tool-cal', to: 'cap-tools',      color: 'amber', delay: 450 },
          { from: 'cap-tools', to: 'core',          color: 'amber' },
          { from: 'core', to: 'cap-realtime',       color: 'magenta' },
          { from: 'cap-realtime', to: 'rt-output',  color: 'magenta' },
          { from: 'rt-output', to: 'voice-tts',     color: 'magenta' },
        ],
      },
    ];

    // TTS-aware sequence trimming. Every prompt currently ends with
    // a `rt-output → voice-tts` step that animates a magenta pulse
    // into TTS. When TTS is disabled, *nothing actually speaks*, so
    // that final hop is misleading. This helper trims that trailing
    // step (and only that one — preserves any earlier `voice-tts`
    // refs, of which there are none today, but future-proof).
    function ttsActiveNow() {
      const cb = document.getElementById('tts-on');
      const checked = cb ? cb.checked : true;
      const haveSynth = !!window.speechSynthesis;
      return checked && haveSynth;
    }
    function activeStepsFor(prompt) {
      if (ttsActiveNow()) return prompt.steps;
      // Drop trailing steps that target voice-tts so the sequence
      // ends at rt-output instead.
      const out = prompt.steps.slice();
      while (out.length && out[out.length - 1].to === 'voice-tts') out.pop();
      return out;
    }

    // ─── memory cache leaf (transient) ──────────────────────────────
    const cacheLeaves = [];
    function spawnCacheLeaf(parentId, label) {
      const parent = NODES[parentId];
      if (!parent) return;
      const offset = new THREE.Vector3(
        (Math.random() - 0.5) * 2.4,
        1.4 + Math.random() * 0.5,
        (Math.random() - 0.5) * 2.4,
      );
      // Anchor cache leaves to the parent's CURRENT (orbital) position
      // — basePos is now just the seed, not the live spot.
      const pos = parent.mesh.position.clone().add(offset);
      const small = makeLabel(label, 0.95, 0.7);
      small.scale.multiplyScalar(0.7);
      small.position.copy(pos);
      scene.add(small);

      // Tiny glowing dot
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xb388ff, transparent: true, opacity: 1.0,
          blending: THREE.AdditiveBlending }),
      );
      dot.position.copy(pos);
      dot.position.y -= 0.55;
      scene.add(dot);

      cacheLeaves.push({ label: small, dot, born: performance.now(), ttl: 8000 });
    }
    function updateCacheLeaves(now) {
      for (let i = cacheLeaves.length - 1; i >= 0; i--) {
        const l = cacheLeaves[i];
        const t = (now - l.born) / l.ttl;
        if (t >= 1) {
          scene.remove(l.label); scene.remove(l.dot);
          l.label.material.map?.dispose(); l.label.material.dispose();
          l.dot.geometry.dispose(); l.dot.material.dispose();
          cacheLeaves.splice(i, 1);
          continue;
        }
        // Fade out in the last 25%
        const alpha = t < 0.75 ? 1.0 : 1.0 - (t - 0.75) / 0.25;
        l.label.material.opacity = 0.95 * alpha;
        l.dot.material.opacity = 1.0 * alpha;
      }
    }

    // ─── TTS via Web Speech API (free, no API key) ─────────────────
    let ttsEnabled = true;
    document.getElementById('tts-on').addEventListener('change', e => {
      ttsEnabled = e.target.checked;
    });

    let preferredVoice = null;
    const voiceSelect = document.getElementById('voice-select');

    function rankVoice(v) {
      let s = 0;
      const n = (v.name || '').toLowerCase();
      const l = (v.lang || '').toLowerCase();
      if (l.startsWith('en')) s += 5;
      if (n.includes('zira') || n.includes('aria') || n.includes('jenny') || n.includes('female')) s += 4;
      if (n.includes('online') || n.includes('natural') || n.includes('neural')) s += 3;
      if (n.includes('david') || n.includes('mark') || n.includes('male')) s -= 1;
      return s;
    }

    function refreshVoiceList() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;
      // Sort with best matches first; show name + lang.
      const sorted = voices.slice().sort((a, b) => rankVoice(b) - rankVoice(a));
      const previous = voiceSelect.value;
      voiceSelect.innerHTML = '';
      for (const v of sorted) {
        const opt = document.createElement('option');
        opt.value = v.voiceURI || v.name;
        opt.textContent = `${v.name} · ${v.lang}`;
        voiceSelect.appendChild(opt);
      }
      // Restore prior pick if it still exists, else top-ranked.
      if (previous && [...voiceSelect.options].some(o => o.value === previous)) {
        voiceSelect.value = previous;
      }
      preferredVoice = voices.find(v => (v.voiceURI || v.name) === voiceSelect.value) || sorted[0];
    }
    voiceSelect.addEventListener('change', () => {
      const voices = window.speechSynthesis.getVoices();
      preferredVoice = voices.find(v => (v.voiceURI || v.name) === voiceSelect.value) || voices[0];
    });

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = refreshVoiceList;
      refreshVoiceList();
    }

    function speak(text, onEnd) {
      if (!ttsEnabled || !text || !window.speechSynthesis) {
        if (onEnd) onEnd();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        if (preferredVoice) u.voice = preferredVoice;
        u.rate = 1.02;
        u.pitch = 1.0;
        u.volume = 0.95;
        u.onstart = () => setStatus(`Speaking · "${text}"`, 'speaking');
        u.onend = () => { setStatus('Idle.'); if (onEnd) onEnd(); };
        u.onerror = () => { setStatus('Idle.'); if (onEnd) onEnd(); };
        window.speechSynthesis.speak(u);
      } catch (e) {
        console.error('tts failed', e);
        if (onEnd) onEnd();
      }
    }

    // ─── prompt button wiring ──────────────────────────────────────
    document.querySelectorAll('.prompt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (sequenceRunning) return;
        const idx = parseInt(btn.dataset.prompt, 10);
        const prompt = PROMPTS[idx];
        if (!prompt) return;
        setStatus(`Firing · "${prompt.label}"`, 'firing');
        // Core enters THINKING the moment the prompt fires.
        setCoreState('thinking');
        const steps = activeStepsFor(prompt);
        playSequence(steps, () => {
          if (prompt.memoryFlare && prompt.cacheLabel) {
            spawnCacheLeaf(prompt.memoryFlare, prompt.cacheLabel);
          }
          // Core transitions to SPEAKING for the duration of the
          // spoken response, then back to IDLE.
          setCoreState('speaking');
          if (ttsEnabled) {
            speak(prompt.response, () => setCoreState('idle'));
          } else {
            setStatus(`"${prompt.response}"`);
            // Without TTS, give the speaking color ~1.2s before idling.
            setTimeout(() => setCoreState('idle'), 1200);
          }
        });
      });
    });

    // ─── picking + interaction (hover, drag, click-to-focus) ──────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredId = null;
    let draggingRef = null;
    const dragPlane = new THREE.Plane();
    const dragOffset = new THREE.Vector3();
    const dragLast = new THREE.Vector3();
    let pressTime = 0;
    let clickCandidate = null;
    const hoverLabel = document.getElementById('hover-label');

    function pickNodeUnderMouse() {
      raycaster.setFromCamera(mouse, camera);
      const meshes = NODE_LIST.map(n => n.mesh);
      const hits = raycaster.intersectObjects(meshes, false);
      return hits.length ? hits[0] : null;
    }

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (cameraState === 'focusing' || cameraState === 'unfocusing') return;
      const hit = pickNodeUnderMouse();
      if (!hit) return;
      const ref = NODES[hit.object.userData.nodeId];
      if (!ref) return;
      clickCandidate = ref;
      pressTime = performance.now();
      // Drag eligibility:
      //   - core (tier 0) is never draggable
      //   - the currently-focused node yields to OrbitControls so the
      //     user can rotate camera around it
      //   - any tier ≥ 1 node (including capabilities) → draggable;
      //     capabilities spring back to their ring position via the
      //     existing physics when released
      const isFocusedNode = ref.id === focusedNodeId;
      const draggable = ref.tier >= 1 && !isFocusedNode;
      if (draggable) {
        draggingRef = ref;
        ref.dragged = true;
        const normal = new THREE.Vector3().subVectors(camera.position, ref.mesh.position).normalize();
        dragPlane.setFromNormalAndCoplanarPoint(normal, ref.mesh.position);
        dragOffset.subVectors(hit.point, ref.mesh.position);
        dragLast.copy(ref.mesh.position);
        controls.enabled = false;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      if (draggingRef) {
        raycaster.setFromCamera(mouse, camera);
        const newPoint = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(dragPlane, newPoint)) {
          newPoint.sub(dragOffset);
          // Clamp the drag so the node can't fly off into deep space.
          // Soft bubble around the orbital target, hard cap from origin.
          const target = draggingRef.target;
          const maxDragR = 40;
          const offset = new THREE.Vector3().subVectors(newPoint, target);
          if (offset.length() > maxDragR) {
            offset.setLength(maxDragR);
            newPoint.copy(target).add(offset);
          }
          if (newPoint.length() > 120) newPoint.setLength(120);
          draggingRef.mesh.position.copy(newPoint);
          draggingRef.velocity.set(0, 0, 0);
          dragLast.copy(newPoint);
        }
        return;
      }

      const hit = pickNodeUnderMouse();
      const id = hit ? hit.object.userData.nodeId : null;
      if (id !== hoveredId) {
        hoveredId = id;
        if (id) {
          const ref = NODES[id];
          hoverLabel.textContent = ref?.label ?? id;
          hoverLabel.classList.add('visible');
        } else {
          hoverLabel.classList.remove('visible');
        }
      }
      if (id) {
        hoverLabel.style.left = (e.clientX + 12) + 'px';
        hoverLabel.style.top = (e.clientY + 14) + 'px';
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      const held = performance.now() - pressTime;
      let moved = false;
      let releasedDrag = false;
      if (draggingRef) {
        moved = draggingRef.mesh.position.distanceTo(dragLast) > 0.01;
        draggingRef.dragged = false;
        draggingRef = null;
        releasedDrag = true;
      }
      const quickClick = clickCandidate && held < 240 && !moved;
      if (quickClick) {
        if (clickCandidate.id === focusedNodeId) {
          unfocusNode();
        } else {
          focusNode(clickCandidate.id);
          // focusNode disables controls; don't re-enable here.
        }
      } else if (releasedDrag) {
        controls.enabled = true;
      }
      clickCandidate = null;
    });

    canvas.addEventListener('dblclick', () => {
      const hit = pickNodeUnderMouse();
      if (!hit) {
        if (focusedNodeId !== null) unfocusNode();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (focusedNodeId !== null) unfocusNode();
      } else if (e.key === 'b' || e.key === 'B') {
        // Toggle bubble-packing debug wireframes (off by default).
        if (typeof BUBBLE_DEBUG !== 'undefined' && BUBBLE_DEBUG) {
          BUBBLE_DEBUG.visible = !BUBBLE_DEBUG.visible;
        }
      } else if (e.key === 's' || e.key === 'S') {
        // Toggle suggestions panel (mirrors 'b' bubble debug toggle).
        const sp = document.getElementById('suggestions-panel');
        if (sp) sp.classList.toggle('visible');
      }
    });

    // ─── bubble-packing debug wireframes ───────────────────────────
    // One dim wireframe icosahedron per tier-1 node, drawn at bubbleR.
    // Default OFF. Toggle with 'b'. Useful for visually confirming the
    // packing prediction matches actual rendered subtree extent. Wireframes
    // are children of BUBBLE_DEBUG (a THREE.Group) — toggling its visibility
    // hides them all in one shot without touching individual meshes.
    const BUBBLE_DEBUG = new THREE.Group();
    BUBBLE_DEBUG.name = 'BUBBLE_DEBUG';
    BUBBLE_DEBUG.visible = false;   // off by default
    scene.add(BUBBLE_DEBUG);
    for (const n of NODE_LIST) {
      if (n.tier !== 1 || !n.bubbleR) continue;
      const geo = new THREE.IcosahedronGeometry(n.bubbleR, 2);
      const mat = new THREE.MeshBasicMaterial({
        color: (n.baseColor != null ? n.baseColor : 0x9cc8e0),
        wireframe: true,
        transparent: true,
        opacity: 0.08,
        depthWrite: false,
      });
      const wire = new THREE.Mesh(geo, mat);
      wire.userData.bubbleOwnerId = n.id;
      wire.position.copy(n.mesh.position);
      BUBBLE_DEBUG.add(wire);
    }
    function updateBubbleDebug() {
      if (!BUBBLE_DEBUG.visible) return;   // skip work when hidden
      for (const wire of BUBBLE_DEBUG.children) {
        const owner = NODES[wire.userData.bubbleOwnerId];
        if (owner && owner.mesh) wire.position.copy(owner.mesh.position);
      }
    }

    // Breadcrumb IRIS chip → unfocus.
    const _bcHome = document.querySelector('#breadcrumb [data-bc-home]');
    if (_bcHome) {
      _bcHome.addEventListener('click', () => unfocusNode());
    }

    // ─── suggestions overlay ───────────────────────────────────────
    // Top-right panel showing proactive suggestions from IRIS_WORLD.
    // Shape per item: {kind, target_node_id, label, why, confidence}.
    // Clicking a row flashes the target node and focusNode()s if it has
    // children. Toggle visibility with 's' key. Hidden when 0 items.
    const SUG_GLYPHS = {
      open_app: '🚀',
      continue_task: '▶️',
      follow_up_person: '👤',
      project_focus: '📁',
      idea: '💡',
      reminder: '⏰',
    };
    function _sugEscape(s) {
      if (s == null) return '';
      return String(s)
        .replace(/[\n\r\t]+/g, ' ')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function flashNode(nodeId) {
      const node = NODES[nodeId];
      if (!node || !node.mat || !node.mat.uniforms || !node.mat.uniforms.uIntensity) return;
      // Tier-3 leaves use MeshBasicMaterial (no uIntensity) — silently skip.
      const baseI = node.baseIntensity != null ? node.baseIntensity : 0.6;
      const baseS = node.baseSurfAmp != null ? node.baseSurfAmp : 0.04;
      node.mat.uniforms.uIntensity.value = Math.min(2.5, baseI + 1.5);
      node.mat.uniforms.uSurfaceAmp.value = Math.max(baseS, 0.15);
      // The frame() loop already lerps uIntensity/uSurfaceAmp back to
      // baseIntensity/baseSurfAmp every tick (see ~line 2733), so we
      // don't need an extra rAF decay — the existing relaxation handles it.
    }
    function renderSuggestions(suggestions) {
      const panel = document.getElementById('suggestions-panel');
      const items = panel ? panel.querySelector('.items') : null;
      if (!panel || !items) return;
      // Empty state: do not show panel at all (constraint).
      if (!suggestions || suggestions.length === 0) {
        items.innerHTML = '';
        panel.classList.remove('visible');
        return;
      }
      const topN = suggestions.slice(0, 5);
      items.innerHTML = topN.map(s => {
        const glyph = s.glyph || SUG_GLYPHS[s.kind] || '💡';
        const label = _sugEscape(s.label || '(unnamed)');
        const why = _sugEscape(s.why || '');
        const target = _sugEscape(s.target_node_id || '');
        return `<div class="sug" data-target="${target}">`
             + `<span class="glyph">${_sugEscape(glyph)}</span>`
             + `<span class="label">${label}</span>`
             + (why ? `<span class="why" title="${why}">?</span>` : '')
             + `</div>`;
      }).join('');
      items.querySelectorAll('.sug').forEach(row => {
        row.addEventListener('click', () => {
          // Debounce during camera animation — picks/focus are disabled
          // while focusing/unfocusing (see frame() camera state machine).
          if (cameraState === 'focusing' || cameraState === 'unfocusing') return;
          const targetId = row.dataset.target;
          if (!targetId || !NODES[targetId]) return;   // unknown node — no-op
          flashNode(targetId);
          if (childCount(targetId) > 0) focusNode(targetId);
        });
      });
      panel.classList.add('visible');
    }
    (function initSuggestions() {
      const sugg = (window.IRIS_WORLD && Array.isArray(window.IRIS_WORLD.suggestions))
        ? window.IRIS_WORLD.suggestions
        : [];
      renderSuggestions(sugg);
      // Polling hook — nothing to refresh from yet, but keep the interval
      // so a future live-bridge event can replace this with a push model.
      setInterval(() => {
        if (window.IRIS_WORLD && Array.isArray(window.IRIS_WORLD.suggestions)) {
          renderSuggestions(window.IRIS_WORLD.suggestions);
        }
      }, 60000);
    })();

    // ─── post-processing ───────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(renderer.getPixelRatio());
    composer.setSize(innerWidth, innerHeight);
    // Match renderer clear color (0x050a14) so reallocated composer render targets
    // flash dark blue instead of black during resize / target reallocation.
    if (typeof composer.setClearColor === 'function') {
      composer.setClearColor(0x050a14, 1);
    }
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.65, 0.38, 0.70);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ─── starfield ────────────────────────────────────────────────
    (function stars() {
      const N = 1400;
      const pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const r = 80 + Math.random() * 60;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        pos[i*3]   = r * Math.sin(p) * Math.cos(t);
        pos[i*3+1] = r * Math.sin(p) * Math.sin(t);
        pos[i*3+2] = r * Math.cos(p);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({
        color: 0xb6cee6, size: 0.45, transparent: true, opacity: 0.5,
        sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending,
      })));
    })();

    // ─── animation ─────────────────────────────────────────────────
    let last = performance.now();
    function frame(now) {
      // Pause expensive per-frame work when the document is hidden
      // (window minimized, tab in background, parent webview occluded).
      // Saves CPU AND avoids browser-throttled rAF stutter on regain
      // focus — we keep the loop alive with a cheap reschedule so that
      // when visibility returns, the next real frame fires immediately.
      if (document.hidden) {
        last = now; // reset dt baseline so we don't compute a huge step on return
        requestAnimationFrame(frame);
        return;
      }
      // Belt-and-suspenders: re-assert clear color every frame so any
      // per-frame render-target swap (composer realloc, bloom MRT bind)
      // paints dark blue instead of pure black on focus regain / resize.
      renderer.setClearColor(0x050a14, 1);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const t = now * 0.001;

      // Camera animation (focus mode fly-in / fly-out). Runs before
      // any other update so controls.target is correct when
      // OrbitControls resumes at the end of the animation.
      if (cameraState === 'focusing' || cameraState === 'unfocusing') {
        const tt = Math.min(1, (now - cameraAnimStart) / CAMERA_ANIM_MS);
        const eased = 1 - Math.pow(1 - tt, 3);
        if (cameraStartPos && cameraEndPos) {
          camera.position.lerpVectors(cameraStartPos, cameraEndPos, eased);
        }
        if (cameraStartTarget && cameraEndTarget) {
          controls.target.lerpVectors(cameraStartTarget, cameraEndTarget, eased);
        }
        if (tt >= 1) {
          cameraState = cameraState === 'focusing' ? 'focused' : 'overview';
          controls.enabled = true;
        }
      } else if (cameraState === 'focused' && focusedNodeId !== null) {
        // Stay locked to the focused node so drag-orbit always rotates
        // around it cleanly, even as it nudges.
        const fNode = NODES[focusedNodeId];
        if (fNode) controls.target.copy(fNode.mesh.position);
      }

      // Update orbital layout (positions for every node).
      updateOrbits(now, dt);
      applyFocusVisibility();
      updateBubbleDebug();

      // Plasma shader animation + intensity decay (only for nodes
      // that actually use the plasma shader — tier-3 leaves use a
      // plain MeshStandardMaterial without these uniforms).
      // Also: focused-bump scale — the focused node and its direct
      // children grow slightly when in focus, smoothly lerping toward
      // the target scale. Halos scale with them so the glow tracks.
      // PERF: precompute focus-affected tier-3 parent once. Tier-3
      // leaves only need the focus-bump / shader-uniform passes when
      // their direct parent is focused (then they're "direct children
      // of focus"). At rest (no focus) or when focus is elsewhere, we
      // can skip the entire body for tier-3 — ~166 nodes × 0 work.
      const _focusParentForLeaves = focusedNodeId;
      for (const id in NODES) {
        const n = NODES[id];

        // Tier-3 fast path: spin is always 0, halo is null, material
        // has no uniforms (MeshBasicMaterial), and focus-bump only
        // applies if their direct parent is the focused node. Skip the
        // entire per-frame block in the common (idle / unrelated-focus)
        // case. The labelSprite scale path also skips, but lazy tier-3
        // sprites only exist when revealed (focus on their parent), so
        // when we skip they aren't onscreen anyway.
        if (n.tier === 3 && n.parent !== _focusParentForLeaves && n.id !== _focusParentForLeaves) {
          continue;
        }

        // Per-mesh slow spin so spheres read as real 3D bodies.
        // Tier 0 + tier 1 spin; tier ≥ 2 is too small for spin to add value.
        if (n.spinX || n.spinY || n.spinZ) {
          n.mesh.rotation.x += dt * n.spinX;
          n.mesh.rotation.y += dt * n.spinY;
          n.mesh.rotation.z += dt * n.spinZ;
        }

        // Focus-bump scale — focused node + its direct children grow.
        try {
          let scaleTarget = 1.0;
          if (focusedNodeId !== null) {
            if (n.id === focusedNodeId)            scaleTarget = 1.55;
            else if (n.parent === focusedNodeId)   scaleTarget = 1.32;
          }
          if (n._focusScale === undefined) n._focusScale = 1.0;
          n._focusScale += (scaleTarget - n._focusScale) * Math.min(1, dt * 4.0);
          if (n.mesh && n.mesh.scale) n.mesh.scale.setScalar(n._focusScale);
          if (n.halo && n.halo.scale) {
            if (n._haloBaseScale === undefined) n._haloBaseScale = n.halo.scale.x || 1.0;
            const s = n._haloBaseScale * n._focusScale;
            n.halo.scale.set(s, s, 1);
          }
          // NB: node.label is the text STRING; the Sprite lives at
          // node.labelSprite. Use the sprite for scale.
          if (n.labelSprite && n.labelSprite.scale) {
            if (n._labelBaseScaleX === undefined) {
              n._labelBaseScaleX = n.labelSprite.scale.x || 1.0;
              n._labelBaseScaleY = n.labelSprite.scale.y || 1.0;
            }
            // Labels grow a bit too — but not as much as the node so
            // they don't end up oversized when zoomed in.
            const lf = 1.0 + (n._focusScale - 1.0) * 0.6;
            n.labelSprite.scale.set(n._labelBaseScaleX * lf, n._labelBaseScaleY * lf, 1);
          }
        } catch (_) { /* defensive: never break the render loop */ }

        if (!n.mat.uniforms || !n.mat.uniforms.uTime) continue;
        n.mat.uniforms.uTime.value = t;
        // While a node is mid-fade (project-removal tween), do NOT lerp
        // uIntensity back toward baseIntensity — that lerp was silently
        // overwriting the fade's per-frame writes, so the sphere stayed
        // bright until the tween finished and the node was deleted in a
        // single frame ("snap disappear"). The fade tween owns both
        // uIntensity and uAlpha while _fading is set.
        if (!n._fading) {
          n.mat.uniforms.uIntensity.value += (n.baseIntensity - n.mat.uniforms.uIntensity.value) * Math.min(1, dt * 3);
          n.mat.uniforms.uSurfaceAmp.value += (n.baseSurfAmp - n.mat.uniforms.uSurfaceAmp.value) * Math.min(1, dt * 2.5);
        }
      }

      updateEdgesAndPulses(now, dt);
      // Edges need to follow the new node positions every frame.
      rebuildAllEdgeGeometries();
      updateCacheLeaves(now);

      controls.update();
      composer.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    addEventListener('resize', () => {
      // Guard against zero-sized renders during minimize / collapsed parent.
      const w = Math.max(1, innerWidth);
      const h = Math.max(1, innerHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      // Re-apply clear color so freshly reallocated targets don't flash black.
      if (typeof composer.setClearColor === 'function') {
        composer.setClearColor(0x050a14, 1);
      }
      bloom.setSize(w, h);
    });

    // ─── visibility change — refresh GPU state on focus regain ────────
    // When the window/tab becomes hidden, the browser may release or
    // throttle GPU state; on return we can get a single black flash
    // and/or a stale composer target. Re-size + force a render to
    // re-bind clear color and post-processing targets cleanly.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      try {
        const w = Math.max(1, innerWidth);
        const h = Math.max(1, innerHeight);
        renderer.setSize(w, h, false);
        composer.setSize(w, h);
        renderer.setClearColor(0x050a14, 1);
        if (typeof composer.setClearColor === 'function') {
          composer.setClearColor(0x050a14, 1);
        }
        bloom.setSize(w, h);
        // Force one full render so the framebuffer is repainted with
        // the proper clear color + bloom output before rAF resumes.
        composer.render();
        // Schedule a second frame on the next rAF tick so the GPU
        // surface is fully re-bound + cleared before the user sees
        // it — closes a 1-frame window where a stale (black) buffer
        // could otherwise bleed through.
        if (typeof frame === 'function') {
          requestAnimationFrame(frame);
        }
      } catch (_) { /* defensive: never break on focus regain */ }
    });

    // ─── live update bridge (OPEN_ISSUES #10) ─────────────────────────
    //
    // Two-way pipe between the Python world_state and this scene. When
    // Iris touches a new file or auto-detects a new project root, the
    // observer registered in run_iris_simulator.py fires
    // CortexBridge.emit_{project,leaf}_added(...), which marshals through
    // QWebChannel into the discrete signals connected below.
    //
    // Cold-start race: the launcher inlines qwebchannel.js at
    // DocumentCreation, so the QWebChannel constructor is available
    // synchronously — but the bridge object itself only lands once the
    // handshake completes. We wrap the connect in a try/catch and degrade
    // silently if anything is missing (page still works from the static
    // window.IRIS_WORLD injection).
    //
    // Page reload: setting up the bridge again on `loadFinished` is the
    // Python side's responsibility; this JS block re-runs from scratch
    // every time the module re-loads, so once the channel re-handshakes
    // the connections re-bind cleanly.

    // ----- transient live-leaf overlay (similar to spawnCacheLeaf) -----
    // Live leaves are short-lived decorative sprites/dots anchored to a
    // parent node's CURRENT position. They re-use the cacheLeaves render
    // pipeline (already updated each frame by updateCacheLeaves) so we
    // don't add a second per-frame pass.
    function liveSpawnLeafNear(parentId, label, ttlMs) {
      try {
        const parent = NODES[parentId] || NODES['cap-tools'] || NODES['core'];
        if (!parent) return;
        const offset = new THREE.Vector3(
          (Math.random() - 0.5) * 2.8,
          1.6 + Math.random() * 0.6,
          (Math.random() - 0.5) * 2.8,
        );
        const pos = parent.mesh.position.clone().add(offset);

        const small = makeLabel(label, 0.95, 0.7);
        small.scale.multiplyScalar(0.72);
        small.position.copy(pos);
        scene.add(small);

        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(0.22, 12, 8),
          new THREE.MeshBasicMaterial({
            color: 0x58e3ff, transparent: true, opacity: 0.0,
            blending: THREE.AdditiveBlending,
          }),
        );
        dot.position.copy(pos);
        dot.position.y -= 0.6;
        scene.add(dot);

        // Brief fade-in over ~1s, then standard cacheLeaves TTL handles
        // the slow fade-out. We hijack born+ttl so the existing updater
        // does the right thing: setting `born = now + fadeInMs` makes
        // the alpha math start at -fadeIn/ttl (negative t), which the
        // updater clamps to alpha=1.0 — so the first ~1s reads as
        // intentional fade-in, then the standard fade-out kicks in.
        const FADE_IN_MS = 1000;
        const ttl = Math.max(2500, Number(ttlMs) || 8000);
        cacheLeaves.push({
          label: small, dot,
          born: performance.now() + FADE_IN_MS,
          ttl: ttl,
        });

        // Manual fade-in (cacheLeaves updater clamps t<0 to alpha=1, but
        // we want a real ramp). One-shot rAF; cheap and self-contained.
        const t0 = performance.now();
        function rampIn() {
          const t = (performance.now() - t0) / FADE_IN_MS;
          if (t >= 1) {
            small.material.opacity = 0.95;
            dot.material.opacity = 1.0;
            return;
          }
          const eased = t * t * (3 - 2 * t);  // smoothstep
          small.material.opacity = 0.95 * eased;
          dot.material.opacity = 1.0 * eased;
          requestAnimationFrame(rampIn);
        }
        rampIn();

        // Visual feedback on the parent node too: nudge plasma intensity
        // briefly so the user sees "this node just got a new leaf."
        if (parent.mat && parent.mat.uniforms && parent.mat.uniforms.uIntensity) {
          parent.mat.uniforms.uIntensity.value = Math.min(
            2.0, (parent.baseIntensity || 0.5) + 0.85
          );
          if (parent.mat.uniforms.uSurfaceAmp) {
            parent.mat.uniforms.uSurfaceAmp.value = Math.max(
              parent.baseSurfAmp || 0.04, 0.10
            );
          }
        }
      } catch (e) {
        console.warn('[iris-sim] liveSpawnLeafNear failed:', e);
      }
    }

    // ----- live project marker (full tier-1 sphere) -----
    // A live "project added" event splices a new tier-1 project node
    // into NODE_DEFS, re-runs applyTier1BubblePacking() so the new
    // sphere lands in a non-overlapping orbital slot computed by the
    // packing math, then builds the full node (mesh + halo + label +
    // orbit state + spring physics + spin + edge-to-core) so it
    // behaves indistinguishably from a hardcoded tier-1 project.
    //
    // Palette: cycle through teal/cyan-family tints so successive live
    // projects don't all share the same color. Indexed by live-project
    // count so the order is stable across reloads.
    const _LIVE_PROJECT_PALETTE = [
      { base: 0x4be0d4, hot: 0xcdf6f0, halo: 0x4be0d4 },
      { base: 0x1de9b6, hot: 0xc8ffea, halo: 0x1de9b6 },
      { base: 0x6ed8a9, hot: 0xd3f4dd, halo: 0x6ed8a9 },
      { base: 0x33c39b, hot: 0xc4f0d8, halo: 0x33c39b },
      { base: 0x58e3ff, hot: 0xeaffff, halo: 0x58e3ff },
      { base: 0xb388ff, hot: 0xede0ff, halo: 0xb388ff },
      { base: 0xef7fc7, hot: 0xffd2ec, halo: 0xef7fc7 },
      { base: 0xf5b542, hot: 0xfff0c0, halo: 0xf5b542 },
    ];
    const _liveProjectIds = new Set();
    function liveAddProject(projectId, label) {
      try {
        if (!projectId) return;
        // If the project sphere already exists (e.g. it was in the
        // initial world payload), just flash it + re-pack to make room
        // for any new descendants picked up later.
        const existing = NODES[`proj-${projectId.toLowerCase().replace(/[^a-z0-9_-]/gi, '-')}`] || NODES[projectId];
        if (existing) {
          if (existing.mat && existing.mat.uniforms && existing.mat.uniforms.uIntensity) {
            existing.mat.uniforms.uIntensity.value = Math.min(
              2.2, (existing.baseIntensity || 0.6) + 1.0
            );
          }
          try { applyTier1BubblePacking(); } catch (_) { /* non-fatal */ }
          return;
        }

        if (_liveProjectIds.has(projectId)) return;
        _liveProjectIds.add(projectId);

        const slug = String(projectId).toLowerCase().replace(/[^a-z0-9_-]/gi, '-');
        const nodeId = `proj-${slug}`;
        const palette = _LIVE_PROJECT_PALETTE[
          (_liveProjectIds.size - 1) % _LIVE_PROJECT_PALETTE.length
        ];
        const r = 1.0;   // matches tier-1 project base radius (see HARDCODED_NODE_DEFS)

        // ── Step 1: splice a tier-1 def into NODE_DEFS so packing sees it ──
        // pos is a placeholder — bubble packing will set _fixedAngle /
        // _fixedPolar / _orbitFromCoreR below.
        //
        // IMPORTANT: We seed _tier2ChildCount / _tier3GrandchildCount with
        // conservative non-zero estimates so bubbleFor() reserves enough
        // orbital room for the descendants that will be added later via
        // liveAddBranch / liveAddCapability. The bubble-packing pass
        // freezes _orbitFromCoreR / _fixedAngle / _fixedPolar on the def
        // and does NOT re-run when sub-nodes arrive — so if we under-
        // estimate the footprint here, late-arriving children will
        // protrude into sibling project bubbles (see OPEN_ISSUES #10).
        // Values chosen to match a "typical project" descBump ≈ 1.3 in
        // bubbleFor (kids=4, grand=6 → 1 + 0.09*log2(5) + 0.02*log2(7) ≈ 1.27).
        const def = {
          id: nodeId, parent: 'core', pos: [0, 0, 0], r: r,
          base: palette.base, hot: palette.hot, halo: palette.halo,
          label: label || projectId, tier: 1,
          _descendantCount: 10,
          _tier2ChildCount: 4,
          _tier3GrandchildCount: 6,
        };
        NODE_DEFS.push(def);
        NODE_DEF_BY_ID[nodeId] = def;

        // ── Step 2: re-run packing to assign _fixedAngle/_fixedPolar/_orbitFromCoreR ──
        // This may also nudge existing tier-1 _orbitFromCoreR up if the new
        // bubble forces a larger ring; sync back to existing node.orbitFromCoreR
        // immediately so updateOrbits picks up the new ring this frame and
        // siblings drift to the new packed distance via their spring physics.
        try { applyTier1BubblePacking(); } catch (_) { /* non-fatal */ }
        for (const d of NODE_DEFS) {
          if ((d.tier ?? 1) !== 1 || d.parent !== 'core') continue;
          const n = NODES[d.id];
          if (n && d._orbitFromCoreR != null) {
            n.orbitFromCoreR = d._orbitFromCoreR;
          }
        }

        // ── Step 3: build the mesh at the bubble-packed position ──
        const orbitR = def._orbitFromCoreR || 16.0;
        const orbitAngle = (def._fixedAngle != null) ? def._fixedAngle : 0;
        const orbitPolar = (def._fixedPolar != null) ? def._fixedPolar : 0;
        const pos = new THREE.Vector3(
          Math.cos(orbitAngle) * Math.cos(orbitPolar) * orbitR,
          Math.sin(orbitPolar) * orbitR,
          Math.sin(orbitAngle) * Math.cos(orbitPolar) * orbitR,
        );

        // Tier-1 look (matches TIER_LOOK[1] used in the initial spawn loop).
        const look = TIER_LOOK[1];
        const mat = makePlasmaMat(Math.random() * 100, palette.base, palette.hot);
        mat.uniforms.uIntensity.value = 0.0;     // fade in via ramp() below
        mat.uniforms.uBodyAmp.value = 0.07 * look.bodyAmpMul;
        mat.uniforms.uSurfaceAmp.value = 0.04 * look.surfAmpMul;
        const baseIntensity = 0.6 * look.intensityMul;

        const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 4), mat);
        mesh.position.copy(pos);
        mesh.userData.nodeId = nodeId;
        // Start near full size so the sphere reads as a real tier-1 body
        // immediately; ramp() animates intensity + halo + label opacity
        // (mesh only does a small 0.9 → 1.0 pop so it visibly "blooms").
        mesh.scale.setScalar(0.9);
        scene.add(mesh);

        const halo = makeHalo(palette.halo, r * look.haloMul, 0.0);
        halo.position.copy(pos);
        scene.add(halo);

        const lbl = makeLabel(label || projectId, 0.0, 0.95);
        lbl.position.set(pos.x, pos.y + r + 0.9, pos.z);
        scene.add(lbl);

        // ── Step 4: build the canonical node object (mirrors the
        // initial spawn loop around line 1312 — every field updateOrbits,
        // applyFocusVisibility, and the spring physics actually read).
        const node = {
          id: nodeId,
          parent: 'core',
          label: label || projectId,
          tier: 1,
          mesh, halo,
          labelSprite: lbl,
          labelBaseOpacity: 0.92,
          mat,
          basePos: pos.clone(),
          baseR: r,
          baseIntensity: baseIntensity,
          baseBodyAmp: mat.uniforms.uBodyAmp.value,
          baseSurfAmp: mat.uniforms.uSurfaceAmp.value,
          lastFireAt: 0,
          baseColor: palette.base,
          hotColor:  palette.hot,
          isCapability: false,

          descendantCount: 0,
          tier2ChildCount: 0,
          tier3GrandchildCount: 0,
          bubbleR: def._bubbleR || 0,
          orbitFromCoreR: orbitR,

          // ── orbit state (matches tier-1 in the initial spawn loop) ──
          orbitAngle: orbitAngle,
          orbitPolar: orbitPolar,
          orbitSpeed: 0.04,        // tier-1 fixed rate — same as hardcoded tier-1
          orbitRadiusMul: 1.0,     // equidistant from parent

          // Per-axis spin for visual liveliness (tier-1 values).
          spinX: 0.08 + Math.random() * 0.10,
          spinY: 0.10 + Math.random() * 0.14,
          spinZ: 0.04 + Math.random() * 0.06,

          // Spring physics — updateOrbits drifts target then springs
          // mesh.position toward it.
          target: pos.clone(),
          velocity: new THREE.Vector3(),

          dragged: false,
        };
        NODES[nodeId] = node;
        NODE_LIST.push(node);

        // updateOrbits subtracts 1 from this map for the sibling count,
        // so include the new node by incrementing core's bucket.
        SIBLING_COUNT_BY_CENTER.set(
          'core',
          (SIBLING_COUNT_BY_CENTER.get('core') || 0) + 1
        );

        // ── Step 5: wire the edge from core to the new project ──
        addEdgeOnce('core', nodeId);

        // ~1s fade-in for intensity + halo + label opacity.
        const FADE_MS = 1000;
        const t0 = performance.now();
        function ramp() {
          const t = Math.min(1, (performance.now() - t0) / FADE_MS);
          const eased = t * t * (3 - 2 * t);
          mat.uniforms.uIntensity.value = baseIntensity * eased;
          halo.material.opacity = look.haloOpacity * eased;
          lbl.material.opacity = 0.92 * eased;
          mesh.scale.setScalar(0.9 + 0.1 * eased);
          if (t < 1) requestAnimationFrame(ramp);
        }
        ramp();
      } catch (e) {
        console.warn('[iris-sim] liveAddProject failed:', e);
      }
    }

    // ----- live project removal (symmetric to liveAddProject) -----
    // Reacts to the projectRemoved signal fired by iris_remove_project
    // (Python side: cortex_emit.project_remove → bridge.emit_project_removed).
    // We fade the project's sphere + halo + label over ~600ms, then remove
    // it from the scene, recursively dispose its tier-2 sub-nodes / tier-3
    // leaves, and remove every edge that referenced any of those nodes
    // (TOOL_LINK_LINES + the EDGES array — tube + line edges alike).
    //
    // Idempotent and best-effort: if the node isn't in NODES (e.g.
    // protected hardcoded root that the Python tool rejected with an
    // error and never actually removed; or a node that was never on
    // screen) we silently no-op.
    //
    // Bubble packing is INTENTIONALLY not re-run — the orbit physics
    // keeps siblings spaced and removed nodes leave their slot empty
    // (acceptable per the OPEN_ISSUES #10 plan; user-visible "hole" is
    // a known tradeoff vs. the cost of repacking on every removal).
    function _disposeMesh(mesh) {
      if (!mesh) return;
      try { scene.remove(mesh); } catch (_) {}
      try { if (mesh.geometry && mesh.geometry.dispose) mesh.geometry.dispose(); } catch (_) {}
      try {
        if (mesh.material) {
          if (Array.isArray(mesh.material)) {
            for (const m of mesh.material) { if (m && m.dispose) m.dispose(); }
          } else if (mesh.material.dispose) {
            mesh.material.dispose();
          }
        }
      } catch (_) {}
    }

    function _removeNodeFromScene(node) {
      if (!node) return;
      _disposeMesh(node.mesh);
      if (node.halo) _disposeMesh(node.halo);
      if (node.labelSprite) _disposeMesh(node.labelSprite);
    }

    function _collectDescendantIds(rootId) {
      // BFS over NODES looking at `parent` links. Returns descendants
      // only (not the root itself).
      const out = [];
      const queue = [rootId];
      while (queue.length) {
        const pid = queue.shift();
        for (const id of Object.keys(NODES)) {
          const n = NODES[id];
          if (!n || n.parent !== pid) continue;
          out.push(id);
          queue.push(id);
        }
      }
      return out;
    }

    // Tracks nodeIds currently mid-fade so duplicate projectRemoved
    // emits (Python now sends both 'pid' and 'proj-pid' forms back-to-
    // back to dodge id-format mismatches) don't kick off a second
    // tween or trigger the "node not found" warning after we've
    // already started teardown.
    const _projectRemovalInFlight = new Set();

    function handleProjectRemoved(projectId) {
      try {
        // INSTRUMENTATION: log every entry so we can confirm Python's
        // remove path actually crossed the bridge.
        console.log('[iris-sim] handleProjectRemoved called with:', projectId);
        if (!projectId) {
          console.warn('[iris-sim] handleProjectRemoved: empty projectId');
          return;
        }
        // Extra debug: enumerate the tier-1 project nodes currently in
        // the scene + the slug forms we're about to try, so any id-
        // format mismatch (bare slug vs proj-prefixed, casing,
        // hyphenation) is obvious in the console instead of "the fade
        // just didn't run." Best-effort — logging must never break
        // the handler.
        try {
          const _projKeysDbg = Object.keys(NODES).filter(
            (k) => NODES[k] && NODES[k].tier === 1 && !NODES[k].isCapability
          );
          const _slugDbg = String(projectId).toLowerCase().replace(/[^a-z0-9_-]/gi, '-');
          console.log(
            '[iris-sim] handleProjectRemoved lookup:',
            'projectId=', projectId,
            'slug=', _slugDbg,
            'proj-slug=', `proj-${_slugDbg}`,
            'tier-1 candidates=', _projKeysDbg
          );
        } catch (_) { /* logging is best-effort */ }
        // Resolve the visual node id — projectRemoved payloads carry
        // the raw slug (e.g. 'vcpkg-master'); the sphere is stored
        // under 'proj-<slug>' (matching liveAddProject's convention).
        // We try multiple id formats so we tolerate Python sending
        // either the raw pid ('vcpkg-master') or the already-prefixed
        // node id ('proj-vcpkg-master'), and so user-typed labels with
        // odd casing/spaces still resolve. Order matters: more-specific
        // first, then fallbacks, then substring rescue.
        const slug = String(projectId).toLowerCase().replace(/[^a-z0-9_-]/gi, '-');
        const stripped = slug.replace(/^proj-/, '');  // tolerate double-prefix
        let nodeId = null;
        if (NODES[`proj-${slug}`]) {
          nodeId = `proj-${slug}`;
        } else if (NODES[projectId]) {
          nodeId = projectId;
        } else if (NODES[`proj-${stripped}`]) {
          nodeId = `proj-${stripped}`;
        } else if (NODES[slug]) {
          nodeId = slug;
        } else {
          // Last-resort: scan NODES for a tier-1 project node whose id
          // contains the slug (covers label/id slug-mismatch like user
          // typing 'vcpkg' when the node is 'proj-vcpkg-master').
          const needle = stripped;
          if (needle && needle.length >= 3) {
            for (const k of Object.keys(NODES)) {
              const n = NODES[k];
              if (!n || n.tier !== 1 || n.isCapability) continue;
              if (k.toLowerCase().indexOf(needle) !== -1) {
                nodeId = k;
                break;
              }
            }
          }
        }
        if (!nodeId) {
          // If we're already fading the matching project (Python sends
          // both 'pid' and 'proj-pid' forms — the second one arrives
          // here after the first already started teardown), stay
          // silent. Otherwise surface the miss so id-format drifts
          // are debuggable instead of "nothing happens, no error".
          const alreadyFading =
            _projectRemovalInFlight.has(`proj-${slug}`) ||
            _projectRemovalInFlight.has(`proj-${stripped}`) ||
            _projectRemovalInFlight.has(projectId) ||
            _projectRemovalInFlight.has(slug);
          if (alreadyFading) return;
          try {
            const projKeys = Object.keys(NODES).filter(
              (k) => NODES[k] && NODES[k].tier === 1 && !NODES[k].isCapability
            );
            console.warn(
              '[iris-sim] handleProjectRemoved: no node for',
              JSON.stringify(projectId),
              'slug=', slug,
              'candidates=', projKeys
            );
          } catch (_) { /* logging is best-effort */ }
          return;
        }

        // Idempotency: a fade already in progress for this nodeId
        // (duplicate emit while the prior tween is still running)
        // should be a no-op, not a second overlapping tween.
        // Idempotency: if a tween is already running for this nodeId
        // (e.g. Python emitted projectRemoved *and* node.fade for the
        // same project, or sent both 'pid' and 'proj-pid' forms), the
        // second entry must be a silent no-op. Without this, a second
        // tween would race the first and the late one would snap the
        // sphere off at the end of its own (shorter) timeline.
        if (_projectRemovalInFlight.has(nodeId)) {
          console.log('[iris-sim] handleProjectRemoved: duplicate for', nodeId, '— fade already in flight, ignoring');
          return;
        }
        _projectRemovalInFlight.add(nodeId);

        const node = NODES[nodeId];
        if (!node || !node.mesh || !node.mesh.material) {
          // node.mesh.material is what every later fade frame reads
          // for opacity; bailing early here (instead of letting the
          // rAF tween hit a TypeError mid-step and silently die)
          // keeps the in-flight guard honest and surfaces the
          // anomaly in the console.
          console.warn(
            '[iris-sim] handleProjectRemoved: node invalid (missing mesh/material)',
            nodeId, node
          );
          _projectRemovalInFlight.delete(nodeId);
          return;
        }

        // Belt-and-braces guard: refuse to remove a hardcoded capability
        // anchor even if Python somehow emits its id (the Python tool
        // already blocks KNOWN_PROJECT_ROOTS, but the simulator should
        // never tear down core scaffolding regardless of the sender).
        if (node.isCapability) {
          console.warn('[iris-sim] refusing to remove capability node:', nodeId);
          _projectRemovalInFlight.delete(nodeId);
          return;
        }

        // Tier-0 (core) is sacred — same guard, separate check.
        if (node.tier === 0) {
          console.warn('[iris-sim] refusing to remove tier-0 core node:', nodeId);
          _projectRemovalInFlight.delete(nodeId);
          return;
        }

        // Schedule removal for the next frame boundary so we never tear
        // down a mesh mid-render (would cause one-frame artifact).
        requestAnimationFrame(() => {
          // _collectDescendantIds is defined earlier in the same
          // <script>, but if a future refactor accidentally drops or
          // renames it (or it throws while walking a malformed NODES
          // entry), the previous version silently aborted the tween
          // here and the in-flight guard kept the nodeId locked
          // forever. Catch + release so the next remove attempt can
          // still run.
          if (typeof _collectDescendantIds !== 'function') {
            console.error('[iris-sim] _collectDescendantIds is not defined');
            _projectRemovalInFlight.delete(nodeId);
            return;
          }
          let descendantIds = [];
          try {
            descendantIds = _collectDescendantIds(nodeId);
          } catch (err) {
            console.error('[iris-sim] _collectDescendantIds failed for', nodeId, err);
            _projectRemovalInFlight.delete(nodeId);
            return;
          }
          const allIds = [nodeId, ...descendantIds];
          const idSet = new Set(allIds);

          // Mark every node about to fade so the per-frame render loop
          // skips its baseIntensity lerp (otherwise that lerp would
          // overwrite uIntensity every frame and the sphere would never
          // visibly dim before being torn down).
          for (const id of allIds) {
            const n = NODES[id];
            if (n) n._fading = true;
          }

          // Capture starting opacities so the tween eases from "wherever
          // they currently sit" rather than snapping to 1.0. We also
          // record whether the mesh material is a ShaderMaterial — its
          // .opacity property is ignored by Three.js for shader pipelines,
          // so we must drive the uAlpha uniform instead.
          const startStates = allIds.map((id) => {
            const n = NODES[id];
            if (!n) return null;
            const mm = (n.mesh && n.mesh.material) || null;
            const isShader = !!(mm && mm.isShaderMaterial);
            const meshOpacity = (mm && !isShader && typeof mm.opacity === 'number')
              ? mm.opacity : 1.0;
            const meshAlpha = (mm && mm.uniforms && mm.uniforms.uAlpha)
              ? (mm.uniforms.uAlpha.value != null ? mm.uniforms.uAlpha.value : 1.0)
              : 1.0;
            const haloOpacity = (n.halo && n.halo.material && typeof n.halo.material.opacity === 'number')
              ? n.halo.material.opacity : 0.0;
            const labelOpacity = (n.labelSprite && n.labelSprite.material && typeof n.labelSprite.material.opacity === 'number')
              ? n.labelSprite.material.opacity : 0.0;
            return { id, isShader, meshOpacity, meshAlpha, haloOpacity, labelOpacity };
          }).filter(Boolean);

          // Plasma shaders don't have a `material.opacity` knob — they
          // use uIntensity (color brightness) and uAlpha (true
          // transparency). Drive both so the sphere dims AND becomes
          // see-through, matching how a "fading" body should read.
          const startIntensities = allIds.map((id) => {
            const n = NODES[id];
            if (!n || !n.mat || !n.mat.uniforms || !n.mat.uniforms.uIntensity) return null;
            return { id, intensity: n.mat.uniforms.uIntensity.value };
          }).filter(Boolean);

          // Also fade edges that reference any removed node so they
          // don't dangle to empty space during the tween. We mutate
          // material.opacity (works on both LineBasic/LineDashed AND
          // the ShaderMaterial via the uOpacity uniform).
          const affectedEdges = [];
          for (const e of EDGES) {
            if (!e) continue;
            if (idSet.has(e.fromId) || idSet.has(e.toId)) {
              affectedEdges.push(e);
            }
          }
          const affectedToolLinks = [];
          if (typeof TOOL_LINK_LINES !== 'undefined' && Array.isArray(TOOL_LINK_LINES)) {
            for (const tl of TOOL_LINK_LINES) {
              if (!tl) continue;
              if (idSet.has(tl.fromId) || idSet.has(tl.toId)) {
                affectedToolLinks.push(tl);
              }
            }
          }

          const FADE_MS = 600;
          const t0 = performance.now();
          function step() {
            const t = Math.min(1, (performance.now() - t0) / FADE_MS);
            const eased = 1 - (t * t * (3 - 2 * t));  // smoothstep, inverted

            for (const s of startStates) {
              const n = NODES[s.id];
              if (!n) continue;
              const mm = n.mesh && n.mesh.material;
              if (mm) {
                if (s.isShader) {
                  // ShaderMaterial ignores .opacity — write uAlpha
                  // instead. The plasma FS reads uAlpha as its output
                  // alpha channel, so eased=0 → fully transparent.
                  if (mm.uniforms && mm.uniforms.uAlpha) {
                    mm.uniforms.uAlpha.value = s.meshAlpha * eased;
                  }
                } else {
                  // Tier-3 leaves are MeshBasicMaterial — opacity works.
                  mm.transparent = true;
                  mm.opacity = s.meshOpacity * eased;
                }
              }
              if (n.halo && n.halo.material) {
                n.halo.material.opacity = s.haloOpacity * eased;
              }
              if (n.labelSprite && n.labelSprite.material) {
                n.labelSprite.material.opacity = s.labelOpacity * eased;
              }
            }
            for (const s of startIntensities) {
              const n = NODES[s.id];
              if (!n || !n.mat || !n.mat.uniforms || !n.mat.uniforms.uIntensity) continue;
              n.mat.uniforms.uIntensity.value = s.intensity * eased;
            }
            for (const e of affectedEdges) {
              if (e.material) {
                if (e.material.uniforms && e.material.uniforms.uOpacity) {
                  e.material.uniforms.uOpacity.value = (e._opacityCurrent != null ? e._opacityCurrent : 1.0) * eased;
                } else if (typeof e.material.opacity === 'number') {
                  e.material.transparent = true;
                  e.material.opacity = (e._opacityCurrent != null ? e._opacityCurrent : 1.0) * eased;
                }
              }
            }
            for (const tl of affectedToolLinks) {
              if (tl.material && typeof tl.material.opacity === 'number') {
                tl.material.opacity = (tl._baseOpacity != null ? tl._baseOpacity : tl.material.opacity) * eased;
              }
            }

            if (t < 1) {
              requestAnimationFrame(step);
              return;
            }

            // Tween done — actually tear down resources.
            for (const id of allIds) {
              const n = NODES[id];
              if (n) _removeNodeFromScene(n);
              delete NODES[id];
            }

            // Drop affected edges from the EDGES array + scene.
            for (const e of affectedEdges) {
              try { if (e.mesh) scene.remove(e.mesh); } catch (_) {}
              try { if (e.mesh && e.mesh.geometry && e.mesh.geometry.dispose) e.mesh.geometry.dispose(); } catch (_) {}
              try { if (e.material && e.material.dispose) e.material.dispose(); } catch (_) {}
            }
            if (affectedEdges.length) {
              const drop = new Set(affectedEdges);
              for (let i = EDGES.length - 1; i >= 0; i--) {
                if (drop.has(EDGES[i])) EDGES.splice(i, 1);
              }
            }
            for (const tl of affectedToolLinks) {
              try { if (tl.mesh) scene.remove(tl.mesh); } catch (_) {}
              try { if (tl.mesh && tl.mesh.geometry && tl.mesh.geometry.dispose) tl.mesh.geometry.dispose(); } catch (_) {}
              try { if (tl.material && tl.material.dispose) tl.material.dispose(); } catch (_) {}
            }
            if (typeof TOOL_LINK_LINES !== 'undefined' && Array.isArray(TOOL_LINK_LINES) && affectedToolLinks.length) {
              const drop = new Set(affectedToolLinks);
              for (let i = TOOL_LINK_LINES.length - 1; i >= 0; i--) {
                if (drop.has(TOOL_LINK_LINES[i])) TOOL_LINK_LINES.splice(i, 1);
              }
            }

            // Forget the live-project marker (so a same-id add later
            // takes the fresh-spawn path instead of the "already present"
            // flash branch in liveAddProject).
            try { _liveProjectIds.delete(projectId); _liveProjectIds.delete(slug); } catch (_) {}
            // Release the in-flight guard now that teardown is done;
            // a subsequent re-add + remove of the same id should be
            // able to run its own tween cleanly.
            try { _projectRemovalInFlight.delete(nodeId); } catch (_) {}
          }
          requestAnimationFrame(step);
        });
      } catch (e) {
        // Upgraded from console.warn → console.error: this catch
        // sits at the OUTER boundary of the handler, so anything
        // landing here means the fade did NOT run. Silent warns let
        // those failures hide in the noise; errors surface them.
        console.error('[iris-sim] handleProjectRemoved fatal:', e, 'projectId=', projectId);
        // Clear the in-flight marker on outer error so a retry isn't
        // permanently blocked by a stale guard entry.
        try {
          const slugErr = String(projectId || '').toLowerCase().replace(/[^a-z0-9_-]/gi, '-');
          _projectRemovalInFlight.delete(projectId);
          _projectRemovalInFlight.delete(slugErr);
          _projectRemovalInFlight.delete(`proj-${slugErr}`);
        } catch (_) {}
      }
    }

    // ----- node-activity helper (used by handleCortexEvent) -----
    // Briefly flares a plasma node's intensity + surface displacement
    // so a generic "this node is doing something" event produces
    // visible feedback without firing a full pulse. The flare ramps
    // up instantly (the next render reads the boosted uniforms) and
    // decays back to base over ~600ms. Idempotent and cheap — re-
    // triggering during the decay just resets the peak.
    function liveNodeActivity(nodeId, intensityBoost) {
      try {
        const node = NODES[nodeId];
        if (!node || !node.mat || !node.mat.uniforms) return;
        const u = node.mat.uniforms;
        if (!u.uIntensity) return;
        const base = (typeof node.baseIntensity === 'number') ? node.baseIntensity : 0.6;
        const baseSurf = (typeof node.baseSurfAmp === 'number') ? node.baseSurfAmp : 0.04;
        const boost = (typeof intensityBoost === 'number' && isFinite(intensityBoost))
          ? Math.max(0.1, Math.min(1.8, intensityBoost))
          : 0.6;
        const peak = Math.min(2.3, base + boost);
        u.uIntensity.value = peak;
        if (u.uSurfaceAmp) u.uSurfaceAmp.value = Math.max(baseSurf, 0.12);

        // Decay back to base intensity over ~600ms. The standard
        // per-frame plasma updater doesn't reset uIntensity on its
        // own (firePulse and liveSpawnLeafNear rely on edge-arrival
        // callbacks or natural overwrite), so we explicitly ramp it.
        const DECAY_MS = 600;
        const t0 = performance.now();
        function decay() {
          const t = (performance.now() - t0) / DECAY_MS;
          if (t >= 1) {
            u.uIntensity.value = base;
            if (u.uSurfaceAmp) u.uSurfaceAmp.value = baseSurf;
            return;
          }
          const eased = 1 - (t * t * (3 - 2 * t));  // smoothstep, inverted
          u.uIntensity.value = base + (peak - base) * eased;
          if (u.uSurfaceAmp) {
            u.uSurfaceAmp.value = baseSurf + (0.12 - baseSurf) * eased;
          }
          requestAnimationFrame(decay);
        }
        requestAnimationFrame(decay);
      } catch (e) {
        console.warn('[iris-sim] liveNodeActivity failed:', e);
      }
    }

    // ----- generic event dispatcher (bridge.event payloads) -----
    // CortexBridge.event is the primary transport for the new
    // CortexEventBus flow on the Python side. Each payload is a JSON
    // object with a `kind` discriminator. We rate-limit per-kind so
    // a runaway producer can't saturate the renderer (the pulse
    // system caps at MAX_PULSES_PER_EDGE per edge anyway, but we
    // also throttle the dispatch loop itself).
    const _eventRateLimit = Object.create(null);
    // Counter so we can see at-a-glance in the devtools console whether
    // events are arriving at all. Logged on first arrival + every 50th.
    let _cortexEventCount = 0;
    function handleCortexEvent(evt) {
      if (!evt || typeof evt !== 'object') return;
      const kind = evt.kind || evt.type || 'unknown';

      // INSTRUMENTATION: log every incoming event so we can debug
      // whether the Python emit chain is actually reaching JS. First few
      // are always logged; afterwards we sample at 1/50 to avoid spam.
      _cortexEventCount += 1;
      if (_cortexEventCount <= 20 || _cortexEventCount % 50 === 0) {
        console.log(
          '[iris-sim] handleCortexEvent #' + _cortexEventCount +
          ' kind=' + kind, evt
        );
      }

      // Per-kind throttle: max one dispatch per 20ms (50 Hz). Status
      // changes are infrequent so we exempt them from the throttle.
      // node.activity and edge.pulse from the Python bus are ALREADY
      // coalesced server-side; throttling them again here was eating
      // every other neuron-fire when bursts arrived close together.
      const _throttleExempt = (
        kind === 'status_change' || kind === 'state' ||
        kind === 'core.state' ||
        kind === 'node.activity' || kind === 'node_activity' ||
        kind === 'edge.pulse' || kind === 'edge_pulse' ||
        kind === 'leaf.add' || kind === 'leaf_add'
      );
      if (!_throttleExempt) {
        const now = performance.now();
        const last = _eventRateLimit[kind] || 0;
        if (now - last < 20) return;
        _eventRateLimit[kind] = now;
      }

      try {
        // Accept BOTH dotted ('edge.pulse' — what CortexEventBus emits)
        // and underscored ('edge_pulse' — legacy/test fixtures) forms
        // so we don't silently drop events when one side renames first.
        if (kind === 'edge.pulse' || kind === 'edge_pulse') {
          const from = evt.from || evt.from_id;
          const to = evt.to || evt.to_id;
          const color = evt.color || 'cyan';
          if (from && to) {
            console.log('[iris-sim] firePulse', from, '→', to, color);
            firePulse(from, to, color);
          } else {
            console.warn('[iris-sim] edge.pulse missing from/to:', evt);
          }
        } else if (kind === 'node.activity' || kind === 'node_activity') {
          const id = evt.node_id || evt.id;
          // Python's CortexEventBus emits `intensity` (not
          // `intensity_boost`). Accept either so old callers still work.
          const intensity = Number(
            evt.intensity != null ? evt.intensity : evt.intensity_boost
          );
          if (id) {
            console.log('[iris-sim] liveNodeActivity', id, 'intensity=', intensity);
            liveNodeActivity(id, intensity);
          } else {
            console.warn('[iris-sim] node.activity missing id:', evt);
          }
        } else if (kind === 'leaf.add' || kind === 'leaf_add' || kind === 'spawn_leaf') {
          const parent = evt.parent_id || evt.parent || 'cap-tools';
          const label = evt.label || 'leaf';
          const ttl = Number(evt.ttl_ms) || 6000;
          console.log('[iris-sim] liveSpawnLeafNear', parent, label, ttl);
          liveSpawnLeafNear(parent, label, ttl);
        } else if (kind === 'node.fade' || kind === 'node_fade') {
          // Python's bus uses node.fade as a generic "smoothly remove
          // this node" signal. Route project-shaped ids through the
          // full project-removal path (handles descendants + edges);
          // best-effort for everything else.
          const id = evt.id || evt.node_id;
          if (id) {
            console.log('[iris-sim] node.fade', id);
            try { handleProjectRemoved(id); } catch (_) { /* best-effort */ }
          }
        } else if (kind === 'node.spawn' || kind === 'node_spawn') {
          // Phase-0 spawn handling: tier-1 project-category spawns
          // route through liveAddProject so the user sees the sphere.
          // Sub-nodes are best-effort no-ops here (the initial scene
          // payload covers them); this is mainly so brand-new projects
          // appear when world_state.add_project fires on an open session.
          const cat = (evt.category || '').toLowerCase();
          const id = evt.id || evt.node_id;
          const label = evt.label || id;
          if (cat === 'project' && id) {
            console.log('[iris-sim] node.spawn project →', id, label);
            liveAddProject(id, label);
          } else {
            console.debug('[iris-sim] node.spawn (non-project, ignored)', evt);
          }
        } else if (kind === 'core.state' || kind === 'state') {
          // Drive the core's color/intensity from Python state changes
          // so the user sees: white=idle, blue=listening, orange=
          // thinking, purple=speaking. Maps the LiveApiState name
          // (e.g. 'LISTENING') onto the lowercased CORE_STATES key.
          try {
            const stateRaw = String(evt.state || evt.name || '').toLowerCase();
            // Common LiveApiState → CORE_STATES alias mapping
            const alias = {
              off:        'idle',
              ready:      'idle',
              listening:  'listening',
              recording:  'listening',
              thinking:   'thinking',
              executing:  'thinking',
              processing: 'thinking',
              speaking:   'speaking',
              outputting: 'speaking',
              responding: 'speaking',
            };
            const target = alias[stateRaw] || (CORE_STATES[stateRaw] ? stateRaw : 'idle');
            setCoreState(target);
          } catch (_) { /* best-effort */ }
        } else if (kind === 'status_change' || kind === 'core.audio') {
          // Reserved — not driving core state from these.
        } else {
          console.debug('[iris-sim] unknown cortex.event kind:', kind, evt);
        }
      } catch (e) {
        console.warn('[iris-sim] handleCortexEvent dispatch failed:', e);
      }
    }

    // ----- expose handlers globally so Python can call them via
    // page().runJavaScript() as a fallback when the QWebChannel signal
    // path is unreliable (cross-process boundary occasionally drops
    // signals during heavy GPU activity). Best-effort: try blocks let
    // page boot continue if anything below is undefined this early.
    try { window.handleProjectRemoved = handleProjectRemoved; } catch (_) {}
    try { window.handleCortexEvent = handleCortexEvent; } catch (_) {}
    try { window.liveAddProject = liveAddProject; } catch (_) {}
    try { window.liveNodeActivity = liveNodeActivity; } catch (_) {}
    try { window.firePulse = firePulse; } catch (_) {}
    try { window.liveSpawnLeafNear = liveSpawnLeafNear; } catch (_) {}

    // ----- bridge connect (deferred, defensive) -----
    function _connectLiveBridge() {
      if (typeof QWebChannel === 'undefined') {
        console.info('[iris-sim] QWebChannel unavailable — running standalone (no live updates)');
        return;
      }
      if (typeof qt === 'undefined' || !qt.webChannelTransport) {
        console.info('[iris-sim] qt.webChannelTransport unavailable — no bridge');
        return;
      }
      try {
        new QWebChannel(qt.webChannelTransport, (channel) => {
          const cortex = channel && channel.objects && channel.objects.cortex;
          if (!cortex) {
            console.warn('[iris-sim] no "cortex" object on channel');
            return;
          }
          // INSTRUMENTATION: log everything the bridge exposes so we can
          // confirm each signal/slot is reachable from JS. Helps diagnose
          // "signal silently dropped" failures by showing whether the
          // signal name even exists.
          try {
            console.log(
              '[iris-sim] cortex bridge connected, signals:',
              Object.keys(cortex)
            );
          } catch (_) { /* logging is best-effort */ }

          // Per-event-type signals (additive — bridge.event is still the
          // primary transport for the existing CortexEventBus flow).
          if (cortex.projectAdded && cortex.projectAdded.connect) {
            cortex.projectAdded.connect((jsonStr) => {
              try {
                const p = JSON.parse(jsonStr || '{}');
                liveAddProject(p.project_id, p.label || p.project_id);
                if (typeof setStatus === 'function') {
                  setStatus(`New project: ${p.label || p.project_id}`, 'firing');
                }
              } catch (e) {
                console.error('[iris-sim] projectAdded parse failed:', e);
              }
            });
          }
          if (cortex.projectRemoved && cortex.projectRemoved.connect) {
            cortex.projectRemoved.connect((jsonStr) => {
              console.log('[iris-sim] projectRemoved signal received:', jsonStr);
              try {
                const p = JSON.parse(jsonStr || '{}');
                handleProjectRemoved(p.project_id);
                if (typeof setStatus === 'function') {
                  setStatus(`Removed project: ${p.label || p.project_id}`, 'firing');
                }
              } catch (e) {
                console.error('[iris-sim] projectRemoved parse failed:', e);
              }
            });
            console.log('[iris-sim] projectRemoved listener attached');
          } else {
            console.warn('[iris-sim] cortex.projectRemoved missing or unconnectable');
          }
          if (cortex.leafAdded && cortex.leafAdded.connect) {
            cortex.leafAdded.connect((jsonStr) => {
              try {
                const p = JSON.parse(jsonStr || '{}');
                // Anchor leaf to the detected project (proj-<slug>), or
                // fall back to cap-tools when no project context exists.
                const slug = (p.project_id || '').toLowerCase().replace(/[^a-z0-9_-]/gi, '-');
                const projNodeId = slug ? `proj-${slug}` : null;
                const parentId = (projNodeId && NODES[projNodeId]) ? projNodeId : 'cap-tools';
                liveSpawnLeafNear(parentId, p.label || 'file', 8000);
              } catch (e) {
                console.error('[iris-sim] leafAdded parse failed:', e);
              }
            });
          }
          if (cortex.toolUsed && cortex.toolUsed.connect) {
            cortex.toolUsed.connect((jsonStr) => {
              try {
                const p = JSON.parse(jsonStr || '{}');
                liveSpawnLeafNear('cap-tools', p.label || p.tool || 'tool', 5000);
              } catch (e) {
                console.error('[iris-sim] toolUsed parse failed:', e);
              }
            });
          }
          if (cortex.patternAdded && cortex.patternAdded.connect) {
            cortex.patternAdded.connect((jsonStr) => {
              try {
                const p = JSON.parse(jsonStr || '{}');
                liveSpawnLeafNear('mem-patterns', p.label || 'pattern', 7000);
              } catch (e) {
                console.error('[iris-sim] patternAdded parse failed:', e);
              }
            });
          }

          // Generic event channel — bridge.event is the primary
          // transport for the CortexEventBus flow on the Python side.
          // The discrete signals above remain wired for back-compat
          // (and to bypass the JSON.parse on hot paths), but anything
          // new should arrive here so we don't need to add another
          // signal-per-event-kind every time the bus grows.
          if (cortex.event && cortex.event.connect) {
            cortex.event.connect((jsonStr) => {
              try {
                const evt = JSON.parse(jsonStr || '{}');
                handleCortexEvent(evt);
              } catch (e) {
                console.error('[iris-sim] cortex.event parse failed:', e);
              }
            });
            console.log('[iris-sim] cortex.event listener attached');
          } else {
            console.warn('[iris-sim] cortex.event missing or unconnectable');
          }

          // Tell the bridge we're ready (also unsuspends any CortexEventBus
          // queued on the Python side — harmless if no bus is wired).
          try { if (cortex.jsReady) cortex.jsReady(); } catch (_) { /* optional */ }
          console.info('[iris-sim] live cortex bridge connected');
        });
      } catch (e) {
        console.warn('[iris-sim] live bridge setup failed:', e);
      }
    }
    _connectLiveBridge();
  </script>
</body>
</html>
